[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "metaarch"
version = "1.0.0"
description = "Nanobind bindings for the MetaArch architecture database"
readme = "README.md"
requires-python = ">=3.9"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = []
install.components = ["python"]

[tool.scikit-build.cmake.define]
ARCHDB_BUILD_PYTHON = "ON"
ARCHDB_BUILD_DSL = "OFF"
ARCHDB_BUILD_TESTS = "OFF"
ARCHDB_BUILD_TOOLS = "OFF"
BUILD_SHARED_LIBS = "OFF"
