# arc.dsymspec.yaml
# Migrated from the Lua DSL (arc.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# arc.dsymspec — Synopsys ARCv2 (ARC EM/HS), little-endian (bi-endian, LE default), ARC EABI.
# Data: LLVM ARC target (ARCRegisterInfo.td: GPR32 r0-r63 + STATUS32 aux10, GPR_S compact,
#   ARCCallingConv.td: args r0-r7, rets r0-r3, callee-saved r13-r25+gp+fp, Retrofit from
#   ArchBank/LLVM-Target/ARC), Binutils libopcode (ArchBank/Binutils-LibOpcode/Body/arc-tbl.h:
#   477 mnemonics, opcode/mask, e.g. add 0x20000000, ld 0x10000000, st 0x18000000),
#   Capstone ARC (ArchBank/Capstone-Arch/ARC: 190 INS + disassembler tables),
#   GCC arc (ArchBank/GCC-Config/arc: arc-cpus.def EM/HS, arc.h BITS_PER_WORD 32),
#   Linux arc (ArchBank/Linux-Arch/arc: ELFCLASS32, 8K pages, 2G:2G split),
#   GDB arc (ArchBank/GDB-Arch/arc.c: ARCV1/ARCV2 ISA).
# Operand names used by encoders: rd, rs, rt, imm, off, sym, cond, aux.
# Strata: base | norm | mpy | shift | atomic | fpu | dsp | cd | loop | priv.

schema: 1
targets:
  - {arch: arc, subarch: arcv2, addr_size: 32, op_size: 32, addr_def: 32, align: 2, byte_order: little, obj_format: ELF32, abi: ARC-EABI, calling_conv: arc, features: [base, mpy, shift, cd]}
features:
  - {name: base, desc: "ARCv2 base integer (add/sub/logical/mov/cmp/branches/loads)"}
  - {name: norm, desc: "norm/normh bit-scan (FeatureNORM, -mattr=+norm)"}
  - {name: mpy, desc: "multiply (mpy/mpym/mpymu/mul64/div/rem/mac)"}
  - {name: shift, desc: "barrel shifter (asl/lsr/asr/ror + compact shifts)"}
  - {name: atomic, desc: "atomic (llock/scond + sync/dmb)"}
  - {name: fpu, desc: "floating-point (fadd/fsub/fmul/fdiv/fcmp/fcvt)"}
  - {name: dsp, desc: "DSP/mac (mac/dmac/mpyd/addsdw/subsdw)"}
  - {name: cd, desc: "code-density short insns (_s 16-bit)"}
  - {name: loop, desc: "zero-overhead loops (lp/dbnz)"}
  - {name: priv, desc: "privileged (flag/sleep/sync/rtie/brk/swi/lr/sr/clri/seti)"}
registers:
  # Core registers r0..r63 (32-bit, 6-bit HW encoding, Dwarf = HW).
  - {name: r0, class: gpr, width: 32, enc: 0, flags: [readable, writable]}
  - {name: r1, class: gpr, width: 32, enc: 1, flags: [readable, writable]}
