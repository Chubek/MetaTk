encoders:
  # RR: op A,B,C (e.g. add r0,r1,r2).
  - name: add_rr
    max_bytes: 4
    body: |
      EMIT32LE 536870912 + rd + rs*64 + rt*4096
  # RU6: op A,B,U6 (e.g. add r0,r1,63).
  - name: add_ru6
    max_bytes: 4
    body: |
      EMIT32LE 536870912 + rd + rs*64 + ((imm + 64) % 64)*4096
  # RLIMM: op A,B,LImm (8 bytes, LImm in high word, C slot = 62).
  - name: add_rlimm
    max_bytes: 8
    body: |
      EMIT32LE 536870912 + rd + rs*64 + 62*4096
      EMIT32LE imm
  # F-setting RR (Inst[15] = 1 -> +0x8000).
  - name: add_f_rr
    max_bytes: 4
    body: |
      EMIT32LE 536870912 + 32768 + rd + rs*64 + rt*4096
