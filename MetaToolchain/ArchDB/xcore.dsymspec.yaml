# xcore.dsymspec.yaml
# Migrated from the Lua DSL (xcore.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# XCore/XS1: 32-bit registers, 16/32-bit instructions, little endian.
# TableGen contains custom-packed ALU forms: backend records preserve them,
# while the assembler forms below use completely resolved ru6/u6 encodings.

schema: 1
targets:
  - {arch: xcore, subarch: xs1, addr_size: 32, op_size: 32, addr_def: 32, align: 2, byte_order: little, obj_format: ELF32, abi: XCore, calling_conv: xcore, features: [base]}
features:
  - {name: base, desc: "XS1 XCore integer and resource ISA"}
registers:
  - {name: r0, class: gpr, width: 32, enc: 0, flags: [readable, writable]}
  - {name: r1, class: gpr, width: 32, enc: 1, flags: [readable, writable]}
  - {name: r2, class: gpr, width: 32, enc: 2, flags: [readable, writable]}
  - {name: r3, class: gpr, width: 32, enc: 3, flags: [readable, writable]}
  - {name: r4, class: gpr, width: 32, enc: 4, flags: [readable, writable]}
  - {name: r5, class: gpr, width: 32, enc: 5, flags: [readable, writable]}
  - {name: r6, class: gpr, width: 32, enc: 6, flags: [readable, writable]}
  - {name: r7, class: gpr, width: 32, enc: 7, flags: [readable, writable]}
  - {name: r8, class: gpr, width: 32, enc: 8, flags: [readable, writable]}
  - {name: r9, class: gpr, width: 32, enc: 9, flags: [readable, writable]}
  - {name: r10, class: gpr, width: 32, enc: 10, flags: [readable, writable]}
  - {name: r11, class: gpr, width: 32, enc: 11, flags: [readable, writable]}
  - {name: cp, class: special, width: 32, enc: 12, flags: [readable, writable]}
  - {name: dp, class: special, width: 32, enc: 13, flags: [readable, writable]}
  - {name: sp, class: special, width: 32, enc: 14, flags: [readable, writable]}
  - {name: lr, class: special, width: 32, enc: 15, flags: [readable, writable]}
mnemonics:
  - {name: ldw}
  - {name: stw}
  - {name: ldc}
  - {name: entsp}
  - {name: retsp}
  # Compiler selection coverage, including forms requiring LLVM custom packing.
  - {name: add}
  - {name: sub}
  - {name: and}
  - {name: or}
  - {name: xor}
  - {name: mul}
  - {name: divs}
  - {name: divu}
  - {name: bl}
  - {name: bru}
  - {name: in}
  - {name: out}
  - {name: syncr}
  - {name: waiteu}
encoders:
  - name: ldw_ru6
    max_bytes: 2
    body: |
      REQUIRE a >= 0
      REQUIRE a <= 11
      REQUIRE b >= 0
      REQUIRE b <= 63
      EMIT16LE 23552 + a*64 + b
  - name: stw_ru6
    max_bytes: 2
    body: |
      REQUIRE a >= 0
      REQUIRE a <= 11
      REQUIRE b >= 0
      REQUIRE b <= 63
      EMIT16LE 21504 + a*64 + b
  - name: ldc_ru6
    max_bytes: 2
    body: |
      REQUIRE a >= 0
      REQUIRE a <= 11
      REQUIRE b >= 0
      REQUIRE b <= 63
      EMIT16LE 26624 + a*64 + b
  - name: entsp_u6
    max_bytes: 2
    body: |
      REQUIRE a >= 0
      REQUIRE a <= 63
      EMIT16LE 30528 + a
  - name: retsp_u6
    max_bytes: 2
    body: |
      REQUIRE a >= 0
      REQUIRE a <= 63
      EMIT16LE 30656 + a
forms:
  - mnemonic: ldw
    encoder: ldw_ru6
    flags: [reads_mem, implicit_ops]
    operands:
      - {kind: reg, class: gpr, width: 32, access: write, constraint: r0-r11}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 63, signed: false, constraint: "ldw/stw: sp-relative offset in 4-byte words; ldc: unsigned constant"}
  - mnemonic: stw
    encoder: stw_ru6
    flags: [writes_mem, implicit_ops]
    operands:
      - {kind: reg, class: gpr, width: 32, access: read, constraint: r0-r11}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 63, signed: false, constraint: "ldw/stw: sp-relative offset in 4-byte words; ldc: unsigned constant"}
  - mnemonic: ldc
    encoder: ldc_ru6
    flags: []
    operands:
      - {kind: reg, class: gpr, width: 32, access: write, constraint: r0-r11}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 63, signed: false, constraint: "ldw/stw: sp-relative offset in 4-byte words; ldc: unsigned constant"}
  - mnemonic: entsp
    encoder: entsp_u6
    flags: [implicit_ops]
    operands:
      - {kind: imm, width: 8, imm_min: 0, imm_max: 63, signed: false, constraint: "stack adjustment in 4-byte words"}
  - mnemonic: retsp
    encoder: retsp_u6
    flags: [return, terminator, implicit_ops]
    operands:
      - {kind: imm, width: 8, imm_min: 0, imm_max: 63, signed: false, constraint: "stack adjustment in 4-byte words"}
syntaxes:
  - {name: default, comment: "#", separator: ", "}
sections:
  - {name: ".text", flags: [exec, alloc, code], align: 2, content: code}
  - {name: ".data", flags: [write, alloc, data], align: 4, content: data}
  - {name: ".bss", flags: [write, alloc, zerofill, data], align: 4, content: data}
backend:
  file: backend/xcore.json
