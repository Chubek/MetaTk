# Synthetic cross-language fixture; not an architecture data correction.
schema: 1
targets:
  - {arch: test, subarch: v1, addr_size: 32, byte_order: little, obj_format: ELF32, abi: test}
  - {arch: test, addr_size: 32, byte_order: big}
registers:
  - {name: r0, class: gpr, width: 32, enc: 0}
  - {name: r1, class: gpr, width: 32, enc: 1}
mnemonics: [{name: pair}, {name: branch}, {name: ret}]
relocs: [{name: R_FIX, width: 20, offset: 5}]
encoders:
  - name: pair
    body: |
      EMIT_IMM 4, dst + ((imm + 256) % 256)*256
  - name: branch
    max_relocs: 1
    body: |
      EMIT8 0xAA
      EMIT32BE 0xA0000005
      EMIT_RELOCATION symbol, R_FIX
  - {name: ret, body: EMIT8 0xC3}
forms:
  - mnemonic: pair
    encoder: pair
    operands:
      - {kind: implicit}
      - {kind: reg, class: gpr, width: 32}
      - {kind: imm, width: 8, signed: true, imm_min: -10, imm_max: 10}
  - {mnemonic: branch, encoder: branch, operands: [{kind: sym, width: 64}]}
  - {mnemonic: ret, encoder: ret, operands: []}
