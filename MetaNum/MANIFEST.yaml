        - name: time_elapse
          symbol: time_elapse_assign()
          description: Time-elapse operator for hybrid-system reachability.
        - name: topological_closure
          symbol: topological_closure_assign()
          description: Closure of an NNC polyhedron.
        - name: affine_image
          symbol: affine_image(Variable, Linear_Expression, denominator)
