    # ============================================================
    # PPL
    # ============================================================
    - id: ppl.space_dimensions_and_expressions
      library: ppl
      description: Linear expressions, constraints, and generators.
      operations:
        - name: linear_expression
          symbol: Linear_Expression
          description: Build affine expressions over variables.
        - name: constraint
          symbol: Constraint (e.g. ==, >=, >, <=, <)
          description: Linear equalities and inequalities.
        - name: generator
          symbol: Generator (point, closure_point, ray, line)
          description: Generators describing a polyhedron's vertices, rays, and lines.
        - name: congruence
          symbol: Congruence
          description: Linear congruences for grids.
        - name: grid_generator
          symbol: Grid_Generator
          description: Generators for grids.
        - name: linear_form
          symbol: Linear_Expression arithmetic
          description: Addition, subtraction, and scalar multiplication of expressions.

    - id: ppl.polyhedra_constructors
      library: ppl
      description: Constructing polyhedra and grids.
      operations:
        - name: from_constraints
          symbol: C_Polyhedron(Constraint_System)
          description: Build a polyhedron from linear constraints (H-representation).
        - name: from_generators
          symbol: C_Polyhedron(Generator_System)
          description: Build a polyhedron from generators (V-representation).
        - name: empty_universe
          symbol: C_Polyhedron(dim, EMPTY | UNIVERSE)
          description: Empty or universe polyhedron of a given dimension.
        - name: nnc_polyhedron
          symbol: NNC_Polyhedron
          description: Polyhedra with non-closed (strict) constraints.
        - name: closed_polyhedron
          symbol: C_Polyhedron
          description: Closed polyhedra.
        - name: grid
          symbol: Grid
          description: Grids (lattice-like sets) represented by congruences or generators.
        - name: box_and_octagon
          symbol: Box, BD_Shape, Octagonal_Shape
          description: Interval, difference-bound, and octagonal abstract domains.

    - id: ppl.polyhedra_queries
      library: ppl
      description: Predicates and properties on polyhedra.
      operations:
        - name: is_empty
          symbol: is_empty()
          description: Test whether a polyhedron is empty.
        - name: is_universe
          symbol: is_universe()
          description: Test whether a polyhedron is the whole space.
        - name: is_bounded
          symbol: is_bounded()
          description: Test boundedness.
        - name: is_discrete
          symbol: is_discrete()
          description: Test whether a polyhedron has finitely many points.
        - name: contains
          symbol: contains(const Polyhedron&)
          description: Test inclusion.
        - name: strictly_contains
          symbol: strictly_contains()
          description: Strict inclusion test.
        - name: relation_with
          symbol: relation_with(Constraint) / relation_with(Generator)
          description: Geometric relation between a polyhedron and a constraint or generator.
        - name: constrains
          symbol: constrains(Variable)
          description: Test whether a variable is constrained.
        - name: bounds_from_above
          symbol: bounds_from_above(Linear_Expression)
          description: Test whether an expression is bounded from above.
        - name: bounds_from_below
          symbol: bounds_from_below(Linear_Expression)
          description: Test whether an expression is bounded from below.
        - name: maximize
          symbol: maximize(Linear_Expression, num, den, closed)
          description: Maximize a linear objective over the polyhedron.
        - name: minimize
          symbol: minimize(Linear_Expression, num, den, closed)
          description: Minimize a linear objective over the polyhedron.
        - name: frequency
          symbol: frequency(Linear_Expression, value)
          description: Frequency of a value of an expression over lattice points.
        - name: bounded_check
          symbol: is_bounded / bounded_hull
          description: Bounded check utilities.

    - id: ppl.polyhedra_set_operations
      library: ppl
      description: Boolean and geometric operations on polyhedra.
      operations:
        - name: intersection
          symbol: intersection_assign()
          description: Intersection of two polyhedra.
        - name: convex_hull
          symbol: poly_hull_assign()
          description: Convex polyhedral hull of two polyhedra.
        - name: bounded_hull
          symbol: bHull_assign / bounded_hull
          description: Bounded convex hull approximation.
        - name: poly_difference
          symbol: poly_difference_assign()
          description: Convex-polyhedral over-approximation of set difference.
        - name: pairwise_merge
          symbol: pairwise_merge / pairwise_merge_assign
          description: Merging of disjunctive polyhedra in a collection.
        - name: cc_hull
          symbol: concatenation / convex_hull of Pointset_Powerset
