# GPPX built-in capability catalogue. Documentation/metadata, NOT interpreted
# at runtime: GPPX.cpp owns built-in directive behavior, and GPPX.c owns the
# public C helper implementations. Plugins can override extension hooks.
name: GPPX Core Builtins
version: 1.0.1
abi: 1
registry_format: 1
runtime: GPPX.cpp
helpers: GPPX.c

directives:
  definitions:
    - define                # NAME [replacement], NAME(params) replacement
    - undef                 # NAME
    - macro                 # NAME(params) / #endmacro block definition
    - endmacro
    - push_macro            # NAME, save previous macro
    - pop_macro             # NAME, restore previous macro
  conditions:
    - if                    # integer expression
    - ifdef                 # identifier exists
    - ifndef                # identifier absent
    - elif                  # integer expression
    - else
    - endif
    - ifmatch               # ENGINE "pattern" => "subject"
    - elifmatch
  files:
    - include               # path, repeat according to include guard
    - include_once          # path, include once
    - import                # path, import once
    - embed                 # path FORMAT
  generation:
    - repeat                # COUNT / #endrepeat
    - endrepeat
    - for                   # NAME in FIRST..LAST / #endfor
    - endfor
    - emit                  # produce expanded text
    - eval                  # output integer expression
    - raw                   # verbatim block / #endraw
    - endraw
  transformations:
    - rewrite               # PATTERN => REPLACEMENT
    - clear_rewrites
  control:
    - syntax                # OPTION VALUE or OPTION=VALUE
    - plugin                # native shared-library path
    - pragma
    - line
    - region
    - endregion
    - sink                  # NAME DATA
    - assert                # EXPRESSION
    - error                 # message; fail
    - warning               # message; continue

predefined_macros:
  - __FILE__
  - __LINE__
  - __COUNTER__
  - __GPPX__

profiles:
  c:
    directive: '#'
    macro_style: bare
    string_expansion: false
  percent:
    directive: '%'
    macro_style: bare
    string_expansion: false
  template:
    directive: '@'
    macro_style: mustache
    string_expansion: false

embed_formats:
  - hex
  - c_array
  - string
  - base64

pattern_engines:
  - regex

sinks:
  - stdout
  - stderr
  - discard

runtime_options:
  - profile
  - directive
  - macro_style
  - macro_open
  - macro_close
  - line_comment
  - block_open
  - block_close
  - expand_strings
  - strict
  - max_depth
  - max_includes
  - max_output

extension_slots:
  - directive
  - macro
  - syntax
  - reader
  - sink
  - embed
  - rewriter
  - pmatch
