# Webber is an illustrative stack machine ISA and preprocessor extension,
# not an assembler for an existing CPU architecture.
name: Webber
version: 1.1.0
api_version: 1
plugin_abi: 1
entry_symbol: gppx_plugin_init
implementation: Assembler.cpp
license: MIT
file_extension: .wbr
output: little_endian_bytecode
max_program_bytes: 65536

extension_points:
  directives:
    - wbr_upper       # uppercase directive arguments
    - wbr_lower       # lowercase directive arguments
  callable_macros:
    - WBR_UPPER        # uppercase one argument
    - WBR_VERSION      # zero args, returns ISA version "1"
  embed_formats:
    - wbr_asm          # assemble source to comma-delimited 0xNN literals
    - wbr_hex          # assemble source to unseparated hexadecimal bytes
  pattern_matchers:
    - wbr_contains     # case-sensitive substring search

isa:
  no_operand:
    NOP: 0x00
    DUP: 0x11
    DROP: 0x12
    SWAP: 0x13
    ADD: 0x20
    SUB: 0x21
    MUL: 0x22
    DIV: 0x23
    MOD: 0x24
    PRINT: 0x30
    HALT: 0xFF
  imm8:
    PUSH: 0x10
  absolute_le16:
    JMP: 0x40
    JZ: 0x41
    JNZ: 0x42
  directives:
    - .BYTE           # comma-separated signed/unsigned bytes
    - .WORD           # comma-separated signed/unsigned LE16 words
    - .ASCII          # decoded bytes from quoted string
    - .ASCIZ          # decoded bytes plus trailing NUL
    - .SPACE          # integer zero-byte count
    - .ALIGN          # power-of-two alignment (<=4096)
    - .ORG            # forward origin, zero fill
    - .EQU            # NAME, integer (symbolic constant)
  labels: "name:"
  symbol_expressions: "name [+|- unsigned_offset]"
  string_escapes:
    - '\\n'
    - '\\r'
    - '\\t'
    - '\\0'
    - '\\\\'
    - '\\"'
    - '\\xHH'
  comment: ';'

examples:
  - ../../examples/webber/sample.wbr
  - ../../examples/webber/extended.wbr
  - ../../examples/webber/demo.gppx
