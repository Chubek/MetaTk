encoders:
  # Power encodings: XO/D/I/B skeletons; shifts as multiplication
  # (RT<<21 == *2097152, RA<<16 == *65536, RB<<11 == *2048).
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0x60000000
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000214 + rd*2097152 + ra*65536 + rb*2048
  - name: subf
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000050 + rd*2097152 + ra*65536 + rb*2048
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000038 + rd*2097152 + ra*65536 + rb*2048
  - name: or
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000378 + rd*2097152 + ra*65536 + rb*2048
  - name: xor
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000278 + rd*2097152 + ra*65536 + rb*2048
  - name: mulli
    max_bytes: 4
    body: |
      EMIT32LE 0x1C000000 + rd*2097152 + ra*65536 + ((imm + 32768) % 65536)
  - name: mullw
    max_bytes: 4
    body: |
      EMIT32LE 0x7C0001D6 + rd*2097152 + ra*65536 + rb*2048
  - name: divw
    max_bytes: 4
    body: |
      EMIT32LE 0x7C0003D6 + rd*2097152 + ra*65536 + rb*2048
  - name: cmpw
    max_bytes: 4
    body: |
      EMIT32LE 0x7C000000 + ra*65536 + rb*2048
  - name: li
    max_bytes: 4
    body: |
      EMIT32LE 0x38000000 + rd*2097152 + ((imm + 32768) % 65536)
  - name: addi
    max_bytes: 4
    body: |
      EMIT32LE 0x38000000 + rd*2097152 + ra*65536 + ((imm + 32768) % 65536)
  - name: addis
    max_bytes: 4
    body: |
      EMIT32LE 0x3C000000 + rd*2097152 + ra*65536 + ((imm + 32768) % 65536)
  - name: lwz
    max_bytes: 4
    body: |
      EMIT32LE 0x80000000 + rd*2097152 + ra*65536 + ((imm + 65536) % 65536)
  - name: stw
    max_bytes: 4
    body: |
      EMIT32LE 0x90000000 + rs*2097152 + ra*65536 + ((imm + 65536) % 65536)
  - name: lbz
    max_bytes: 4
