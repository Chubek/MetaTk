# ppc64.dsymspec.yaml
# Migrated from the Lua DSL (ppc64.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# ppc64.dsymspec — Power ISA 64 (ppc64le, ELFv2 ABI).
# Data: TableGen PowerPC/PPCRegisterInfo.td (GPR/FPR/VR classes, CR0-CR7,
# LR/CTR/XER) + PPC.td features (Altivec, VSX, HTM, MMA, SPE, E500),
# arch_oracle ppc64 quick facts (GPR0-31/FPR0-31/CR/LR/CTR, 32-bit fixed),
# ccbe_oracle ABI topics (ELFv2 calling convention, TOC/GOT/PLT).
# Strata: base | fpu | altivec | vsx | power8/9/10 | dfp | htm | mma | priv.

schema: 1
targets:
  - {arch: ppc64, subarch: power9, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ELF64, abi: ELFv2, calling_conv: elfv2, features: [base, fpu, altivec, vsx]}
features:
  - {name: base, desc: "Power ISA base integer + branches"}
  - {name: fpu, desc: "floating point unit"}
  - {name: altivec, desc: "AltiVec/VMX"}
  - {name: vsx, desc: "VSX (incl. Altivec)"}
  - {name: power8, desc: "POWER8 ISA"}
  - {name: power9, desc: "POWER9 ISA"}
  - {name: power10, desc: "POWER10 ISA"}
  - {name: power11, desc: "POWER11 ISA"}
  - {name: dfp, desc: "decimal floating point"}
  - {name: htm, desc: "hardware transactional memory"}
  - {name: mma, desc: "matrix-multiply assist"}
  - {name: crypto, desc: "in-core crypto (vcipher)"}
  - {name: spe, desc: "signal processing engine (embedded)"}
  - {name: e500, desc: "e500 embedded category"}
  - {name: vle, desc: "variable length encoding (embedded)"}
  - {name: book3s, desc: "server MMU (PTE/slb)"}
  - {name: priv, desc: "privileged (MSR/SPR access, rfid)"}
