# lanai.dsymspec.yaml
# Migrated from the Lua DSL (lanai.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# Lanai 32-bit big-endian target. C ABI normally passes arguments on stack;
# inreg/fastcc use r6/r7/r18/r19. See emitted CC_Lanai32 and CC_Lanai32_Fast.

schema: 1
targets:
  - {arch: lanai, subarch: lanai, addr_size: 32, op_size: 32, addr_def: 32, align: 4, byte_order: big, obj_format: ELF32, abi: Lanai32, calling_conv: lanai32, features: [base]}
features:
  - {name: base, desc: "Lanai 32-bit integer ISA"}
registers:
  - {name: r0, class: gpr, width: 32, enc: 0, flags: [readable]}
  - {name: r1, class: gpr, width: 32, enc: 1, flags: [readable]}
  - {name: r2, class: gpr, width: 32, enc: 2, flags: [readable, writable]}
  - {name: r3, class: gpr, width: 32, enc: 3, flags: [readable, writable]}
  - {name: r4, class: gpr, width: 32, enc: 4, flags: [readable, writable]}
  - {name: r5, class: gpr, width: 32, enc: 5, flags: [readable, writable]}
  - {name: r6, class: gpr, width: 32, enc: 6, flags: [readable, writable]}
  - {name: r7, class: gpr, width: 32, enc: 7, flags: [readable, writable]}
  - {name: r8, class: gpr, width: 32, enc: 8, flags: [readable, writable]}
  - {name: r9, class: gpr, width: 32, enc: 9, flags: [readable, writable]}
  - {name: r10, class: gpr, width: 32, enc: 10, flags: [readable, writable]}
  - {name: r11, class: gpr, width: 32, enc: 11, flags: [readable, writable]}
  - {name: r12, class: gpr, width: 32, enc: 12, flags: [readable, writable]}
  - {name: r13, class: gpr, width: 32, enc: 13, flags: [readable, writable]}
  - {name: r14, class: gpr, width: 32, enc: 14, flags: [readable, writable]}
  - {name: r15, class: gpr, width: 32, enc: 15, flags: [readable, writable]}
  - {name: r16, class: gpr, width: 32, enc: 16, flags: [readable, writable]}
  - {name: r17, class: gpr, width: 32, enc: 17, flags: [readable, writable]}
  - {name: r18, class: gpr, width: 32, enc: 18, flags: [readable, writable]}
  - {name: r19, class: gpr, width: 32, enc: 19, flags: [readable, writable]}
  - {name: r20, class: gpr, width: 32, enc: 20, flags: [readable, writable]}
  - {name: r21, class: gpr, width: 32, enc: 21, flags: [readable, writable]}
  - {name: r22, class: gpr, width: 32, enc: 22, flags: [readable, writable]}
  - {name: r23, class: gpr, width: 32, enc: 23, flags: [readable, writable]}
  - {name: r24, class: gpr, width: 32, enc: 24, flags: [readable, writable]}
  - {name: r25, class: gpr, width: 32, enc: 25, flags: [readable, writable]}
  - {name: r26, class: gpr, width: 32, enc: 26, flags: [readable, writable]}
  - {name: r27, class: gpr, width: 32, enc: 27, flags: [readable, writable]}
  - {name: r28, class: gpr, width: 32, enc: 28, flags: [readable, writable]}
  - {name: r29, class: gpr, width: 32, enc: 29, flags: [readable, writable]}
  - {name: r30, class: gpr, width: 32, enc: 30, flags: [readable, writable]}
  - {name: r31, class: gpr, width: 32, enc: 31, flags: [readable, writable]}
  - {name: pc, class: special, width: 32, enc: 2, parent: r2, sub_lo: 0, sub_hi: 32}
  - {name: sp, class: special, width: 32, enc: 4, parent: r4, sub_lo: 0, sub_hi: 32}
  - {name: fp, class: special, width: 32, enc: 5, parent: r5, sub_lo: 0, sub_hi: 32}
  - {name: rv, class: special, width: 32, enc: 8, parent: r8, sub_lo: 0, sub_hi: 32}
  - {name: rr1, class: special, width: 32, enc: 10, parent: r10, sub_lo: 0, sub_hi: 32}
  - {name: rr2, class: special, width: 32, enc: 11, parent: r11, sub_lo: 0, sub_hi: 32}
  - {name: rca, class: special, width: 32, enc: 15, parent: r15, sub_lo: 0, sub_hi: 32}
  - {name: sw, class: status, width: 32, enc: 0}
mnemonics:
  - {name: add}
  - {name: nop}
  - {name: ld}
encoders:
  # ADD_I_LO: imm16[15:0], Rs1[22:18], Rd[27:23], unsigned low immediate.
  - name: add_i_lo
    max_bytes: 4
    body: |
      REQUIRE rd >= 0
      REQUIRE rd <= 31
      REQUIRE rs >= 0
      REQUIRE rs <= 31
      REQUIRE imm >= 0
      REQUIRE imm <= 65535
      EMIT32BE rd*8388608 + rs*262144 + imm
  - name: nop
    max_bytes: 4
    body: |
      EMIT32BE 1
  - name: ret
    max_bytes: 4
    body: |
      EMIT32BE 0x8116FFFC
forms:
  - mnemonic: add
    encoder: add_i_lo
    operands:
      - {kind: reg, class: gpr, width: 32, access: read}
      - {kind: imm, width: 16, imm_min: 0, imm_max: 65535, signed: false}
      - {kind: reg, class: gpr, width: 32, access: write}
  - mnemonic: nop
    encoder: nop
  # LLVM RET is spelled ld -4[%fp], %pc; not a generic load encoder.
  - mnemonic: ld
    encoder: ret
    flags: [return, terminator, reads_mem, implicit_ops, delayed]
    syntaxes: [return]
syntaxes:
  - {name: default, reg_prefix: "%", comment: "!", separator: ", "}
  - {name: return, reg_prefix: "%", comment: "!", tmpl: "ld -4[%fp], %pc"}
sections:
  - {name: ".text", flags: [exec, alloc, code], align: 4, content: code}
  - {name: ".data", flags: [write, alloc, data], align: 4, content: data}
  - {name: ".bss", flags: [write, alloc, zerofill, data], align: 4, content: data}
backend:
  file: backend/lanai.json
