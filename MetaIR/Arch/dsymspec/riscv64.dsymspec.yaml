encoders:
  # Encoders (shifts expressed as multiplication; disjoint fields use '+'.
  # `<< 7` == *128, `<< 15` == *32768, `<< 20` == *1048576, `<< 12` == *4096.)
  # Base R-type ALU.
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0x00000013
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x00000033 + rd*128 + rs1*32768 + rs2*1048576
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0x40000033 + rd*128 + rs1*32768 + rs2*1048576
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x00007033 + rd*128 + rs1*32768 + rs2*1048576
  - name: or
    max_bytes: 4
    body: |
      EMIT32LE 0x00006033 + rd*128 + rs1*32768 + rs2*1048576
  - name: xor
    max_bytes: 4
    body: |
      EMIT32LE 0x00004033 + rd*128 + rs1*32768 + rs2*1048576
  - name: sll
    max_bytes: 4
    body: |
      EMIT32LE 0x00001033 + rd*128 + rs1*32768 + rs2*1048576
  - name: srl
    max_bytes: 4
    body: |
      EMIT32LE 0x00005033 + rd*128 + rs1*32768 + rs2*1048576
  - name: sra
    max_bytes: 4
    body: |
      EMIT32LE 0x40005033 + rd*128 + rs1*32768 + rs2*1048576
  - name: slt
    max_bytes: 4
    body: |
      EMIT32LE 0x00002033 + rd*128 + rs1*32768 + rs2*1048576
  - name: sltu
    max_bytes: 4
    body: |
      EMIT32LE 0x00003033 + rd*128 + rs1*32768 + rs2*1048576
  # Base I-type.
  - name: addi
    max_bytes: 4
    body: |
      EMIT32LE 0x00000013 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: li
    max_bytes: 4
    body: |
      EMIT32LE 0x00000013 + rd*128 + ((imm + 4096) % 4096)*1048576
  - name: lui
    max_bytes: 4
    body: |
      EMIT32LE 0x00000037 + rd*128 + ((imm + 524288) % 1048576)
  - name: auipc
    max_bytes: 4
    body: |
      EMIT32LE 0x00000017 + rd*128 + ((imm + 524288) % 1048576)
  # Loads / stores (word, double, byte, half).
  - name: lw
    max_bytes: 4
    body: |
      EMIT32LE 0x00002003 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: ld
    max_bytes: 4
    body: |
      EMIT32LE 0x00003003 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: lb
    max_bytes: 4
    body: |
      EMIT32LE 0x00000003 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: lbu
    max_bytes: 4
    body: |
      EMIT32LE 0x00004003 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: lh
    max_bytes: 4
    body: |
      EMIT32LE 0x00001003 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: sw
    max_bytes: 4
    body: |
      EMIT32LE 0x00002023 + (imm % 32)*128 + rs1*32768 + rs2*1048576 + ((imm / 32) % 128)*33554432
  - name: sd
    max_bytes: 4
    body: |
      EMIT32LE 0x00003023 + (imm % 32)*128 + rs1*32768 + rs2*1048576 + ((imm / 32) % 128)*33554432
  - name: sb
    max_bytes: 4
    body: |
      EMIT32LE 0x00000023 + (imm % 32)*128 + rs1*32768 + rs2*1048576 + ((imm / 32) % 128)*33554432
  - name: sh
    max_bytes: 4
    body: |
      EMIT32LE 0x00001023 + (imm % 32)*128 + rs1*32768 + rs2*1048576 + ((imm / 32) % 128)*33554432
  # Control transfer.
  - name: jalr
    max_bytes: 4
    body: |
      EMIT32LE 0x00000067 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: jal
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x0000006F + rd*128
      EMIT_RELOCATION sym, R_RISCV_CALL
  - name: beq
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x00000063 + rs1*32768 + rs2*1048576
      EMIT_RELOCATION sym, R_RISCV_BRANCH
  - name: bne
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x00001063 + rs1*32768 + rs2*1048576
      EMIT_RELOCATION sym, R_RISCV_BRANCH
  - name: blt
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x00004063 + rs1*32768 + rs2*1048576
      EMIT_RELOCATION sym, R_RISCV_BRANCH
  - name: bge
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x00005063 + rs1*32768 + rs2*1048576
      EMIT_RELOCATION sym, R_RISCV_BRANCH
  - name: ret
    max_bytes: 4
    body: |
      EMIT32LE 0x00008067
  # M extension.
  - name: mul
    max_bytes: 4
    body: |
      EMIT32LE 0x02000033 + rd*128 + rs1*32768 + rs2*1048576
  - name: div
    max_bytes: 4
    body: |
      EMIT32LE 0x02004033 + rd*128 + rs1*32768 + rs2*1048576
  - name: rem
    max_bytes: 4
    body: |
      EMIT32LE 0x02006033 + rd*128 + rs1*32768 + rs2*1048576
  # A extension (representative).
  - name: lrw
    max_bytes: 4
    body: |
      EMIT32LE 0x1000202F + rd*128 + rs1*32768
  - name: scw
    max_bytes: 4
    body: |
      EMIT32LE 0x1800202F + rd*128 + rs1*32768 + rs2*1048576
  - name: amoswapw
    max_bytes: 4
    body: |
      EMIT32LE 0x0800202F + rd*128 + rs1*32768 + rs2*1048576
  # Zicsr / fences / priv.
  - name: csrrw
    max_bytes: 4
    body: |
      EMIT32LE 0x00001073 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: fence
    max_bytes: 4
    body: |
      EMIT32LE 0x0FF0000F
  - name: fencei
    max_bytes: 4
    body: |
      EMIT32LE 0x0000100F
  - name: ecall
    max_bytes: 4
    body: |
      EMIT32LE 0x00000073
  - name: ebreak
    max_bytes: 4
    body: |
      EMIT32LE 0x00100073
  - name: mret
    max_bytes: 4
    body: |
      EMIT32LE 0x30200073
  - name: wfi
    max_bytes: 4
    body: |
      EMIT32LE 0x10500073
  # F/D (representative single/double add/mul + loads/stores).
  - name: flw
    max_bytes: 4
    body: |
      EMIT32LE 0x00002007 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: fsw
    max_bytes: 4
    body: |
      EMIT32LE 0x00002027 + (imm % 32)*128 + rs1*32768 + rs2*1048576 + ((imm / 32) % 128)*33554432
  - name: fadds
    max_bytes: 4
    body: |
      EMIT32LE 0x00000053 + rd*128 + rs1*32768 + rs2*1048576
  - name: fmuls
    max_bytes: 4
    body: |
      EMIT32LE 0x10000053 + rd*128 + rs1*32768 + rs2*1048576
  - name: faddd
    max_bytes: 4
    body: |
      EMIT32LE 0x02000053 + rd*128 + rs1*32768 + rs2*1048576
  # Zb* / Zicond / pause.
  - name: andn
    max_bytes: 4
    body: |
      EMIT32LE 0x40007033 + rd*128 + rs1*32768 + rs2*1048576
  - name: sh1add
    max_bytes: 4
    body: |
      EMIT32LE 0x20002033 + rd*128 + rs1*32768 + rs2*1048576
  - name: bseti
    max_bytes: 4
    body: |
      EMIT32LE 0x00001013 + rd*128 + rs1*32768 + ((imm + 4096) % 4096)*1048576
  - name: czeroeqz
    max_bytes: 4
    body: |
      EMIT32LE 0x0E005033 + rd*128 + rs1*32768 + rs2*1048576
  - name: pause
    max_bytes: 4
    body: |
      EMIT32LE 0x0100000F
  # V (representative: vadd.vv, vle32.v, vse32.v, vsetvli).
  - name: vaddvv
    max_bytes: 4
    body: |
      EMIT32LE 0x02000057 + rd*128 + rs1*32768 + rs2*1048576
  - name: vle32v
    max_bytes: 4
    body: |
      EMIT32LE 0x00006007 + rd*128 + rs1*32768
  - name: vse32v
    max_bytes: 4
    body: |
      EMIT32LE 0x00006027 + rs1*32768 + rs2*1048576
  - name: vsetvli
    max_bytes: 4
    body: |
      EMIT32LE 0x00007057 + rd*128 + rs1*32768 + ((imm + 2048) % 2048)*1048576
  # C (representative 16-bit).
  - name: caddi
    max_bytes: 2
    body: |
      EMIT16LE 0x0001 + rd*128 + ((imm + 32) % 32)*4096
  - name: cnop
    max_bytes: 2
    body: |
      EMIT16LE 0x0001
