# riscv64.dsymspec.yaml
# Migrated from the Lua DSL (riscv64.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# riscv64.dsymspec — RISC-V RV64 (G + B/Zb + K + V + F/D + C, LP64D ABI).
# Data: domainlet/bekern/arch/_arch_specs.py; encodings: RISC-V ISA manual
# (unpriv + priv + vector), cross-checked via arch_oracle / tablegen_inquiry
# (RISCVFeatures.td: FeatureStdExtM/A/F/D/C/V, Zba/Zbb/Zbs/Zbkb, Zk*, Zfh,
# Zfa, Zicond, Zihintpause, Zicsr, Zifencei) and isa_reference RV64 quick spec
# (x0-x31 ABI roles, R/I/S/B/U/J formats).
# Operand names used by encoders: rd, rs1, rs2, imm, sym, id.
# Strata: base I | M | A | F/D | C | Zb*/Zk* | V | Zicsr/Zifencei/priv.

schema: 1
targets:
  - {arch: riscv64, subarch: rv64gcv, addr_size: 64, op_size: 32, addr_def: 64, align: 2, byte_order: little, obj_format: ELF64, abi: LP64D, calling_conv: lp64d, features: [i, m, a, f, d, c, zicsr, zifencei]}
features:
  # Base + M/A/F/D/C (as before) plus stratified extensions.
  - {name: i, desc: "RV64I base integer"}
  - {name: m, desc: "integer multiply/divide"}
  - {name: a, desc: "atomic (lr/sc/amo)"}
  - {name: f, desc: "single-precision floating point"}
  - {name: d, desc: "double-precision floating point"}
  - {name: c, desc: "compressed (16-bit) instructions"}
  - {name: zicsr, desc: "control and status registers"}
  - {name: zifencei, desc: "instruction-fetch fence"}
  - {name: v, desc: "vector extension (RVV 1.0)"}
  - {name: zba, desc: "address-generation (sh*add)"}
  - {name: zbb, desc: "basic bit-manipulation"}
  - {name: zbs, desc: "single-bit instructions"}
  - {name: zbkb, desc: "bitmanip for cryptography"}
  - {name: zknd, desc: "NIST AES decryption"}
  - {name: zkne, desc: "NIST AES encryption"}
  - {name: zknh, desc: "NIST hash (SHA2-256/512)"}
  - {name: zfh, desc: "half-precision floating point"}
  - {name: zfa, desc: "additional floating point (fli/min/max)"}
  - {name: zicond, desc: "integer conditional ops (czero)"}
  - {name: zihintpause, desc: "pause hint"}
  - {name: priv, desc: "privileged (mret/sret/wfi/sfence)"}
