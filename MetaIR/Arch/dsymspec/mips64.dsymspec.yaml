# mips64.dsymspec.yaml
# Migrated from the Lua DSL (mips64.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# mips64.dsymspec — MIPS64 (MIPS64r2), o64/n64 ABI, little-endian.
# Data: TableGen Mips target (GPR $0-$31 + ABI names, FPR $f0-$f31, HI/LO,
# MSA W0-W31, CP0 Status/Cause/EPC), arch_oracle mips quick facts
# ($0-$31/HI/LO/PC, 32-bit fixed), isa_reference mips (delay slots, o-abi
# conventions), toolchain_orace (MIPS ELF relocations R_MIPS_*).
# Strata: base(r2) | fpu | dsp | msa | mips16/micromips | mt | priv.

schema: 1
targets:
  - {arch: mips64, subarch: mips64r2, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ELF64, abi: n64, calling_conv: o64, features: [mips64r2, fpu, nan2008]}
features:
  - {name: mips64r2, desc: "MIPS64 Release 2"}
  - {name: fpu, desc: "floating point unit"}
  - {name: mips16, desc: MIPS16e}
  - {name: micromips, desc: microMIPS}
  - {name: dsp, desc: "DSP ASE"}
  - {name: dspr2, desc: "DSP ASE Release 2"}
  - {name: msa, desc: "MIPS SIMD Architecture"}
  - {name: mt, desc: "multi-threading (mftr/mttr)"}
  - {name: nan2008, desc: "IEEE 754-2008 NaN"}
  - {name: ginv, desc: "global invalidation"}
  - {name: priv, desc: "privileged (CP0/TLB)"}
