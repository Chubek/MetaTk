format: TeX-Primitive-Catalog/1
scope:
  interpretation: TeX primitives, including control symbols; not macro packages or primitives of all descendant
    engines
  baseline: The supplied TeX82-family source snapshot, which includes later TeX features; not a claim
    of the unmodified 1982 release.
  registered_primitive_count: 325
  completeness: Every primitive(s,c,o) registration in both supplied files is represented exactly once.
    This does not enumerate unnamed/frozen internal equivalences or format-defined control sequences.
  etex: No e-TeX-only primitive registrations found. Internal e-TeX-inspired changes are not ruled out.
    No e-TeX-only primitive is claimed to be supported.
  excluded_examples:
  - \documentclass (LaTeX macro)
  - \bye (plain TeX macro)
  - \numexpr (e-TeX primitive, absent here)
  - \pdfoutput (pdfTeX primitive, absent here)
