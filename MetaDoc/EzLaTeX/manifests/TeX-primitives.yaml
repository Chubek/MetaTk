- file: CodeYAML.schema.json
  sha256: 9356202927217f707a766f1cd290aead701c35bfc292add45bb77d906d4586da
conventions:
  name: Unescaped name; the one-space name is control-space.
  expandable: Whether the registered command is handled by TeX expansion rather than ordinary execution.
    Context can suppress expansion.
  command_code: Implementation-local numeric code; not a portable opcode.
  operand: Implementation-local modifier or equivalence-table address.
  pascal_line: Original Pascal line stored in CodeYAML, not the physical YAML line.
  availability: Static registration evidence, not a runtime conformance result.
