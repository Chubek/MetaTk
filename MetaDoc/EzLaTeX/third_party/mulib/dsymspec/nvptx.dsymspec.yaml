encoders:
  - name: nop
    max_bytes: 1
    body: |
      EMIT8 0x00
  - name: mov
    max_bytes: 4
    body: |
      EMIT32LE 0x80000000 + dst*256 + src*65536
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x80020000 + dst*256 + a*65536 + b*131072
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0x80040000 + dst*256 + a*65536 + b*131072
  - name: mul
    max_bytes: 4
    body: |
      EMIT32LE 0x80050000 + dst*256 + a*65536 + b*131072
  - name: mad
    max_bytes: 4
    body: |
      EMIT32LE 0x80060000 + dst*256 + a*65536 + b*131072
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x80070000 + dst*256 + a*65536 + b*131072
  - name: or
    max_bytes: 4
    body: |
      EMIT32LE 0x80080000 + dst*256 + a*65536 + b*131072
  - name: xor
    max_bytes: 4
    body: |
      EMIT32LE 0x80090000 + dst*256 + a*65536 + b*131072
  - name: shl
    max_bytes: 4
    body: |
      EMIT32LE 0x800A0000 + dst*256 + a*65536 + b*131072
  - name: setp
    max_bytes: 4
    body: |
      EMIT32LE 0x80100000 + dst*256 + a*65536 + b*131072
  - name: cvt
    max_bytes: 4
    body: |
      EMIT32LE 0x80120000 + dst*256 + src*65536
  - name: ld
    max_bytes: 4
    body: |
      EMIT32LE 0x10000000 + dst*256 + addr*65536
  - name: st
    max_bytes: 4
    body: |
      EMIT32LE 0x10020000 + addr*65536 + val*256
  - name: cpload
    max_bytes: 4
    body: |
      EMIT32LE 0x10040000 + dst*256 + addr*65536
  - name: atomadd
    max_bytes: 4
    body: |
      EMIT32LE 0x10080000 + addr*65536 + val*256
  - name: bra
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x20000000
      EMIT_RELOCATION sym, R_NVPTX_REL32
  - name: call
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x21000000
      EMIT_RELOCATION sym, R_NVPTX_REL32
  - name: ret
    max_bytes: 1
    body: |
      EMIT8 0x01
  - name: exit
    max_bytes: 1
    body: |
      EMIT8 0x02
  - name: bar
    max_bytes: 4
    body: |
      EMIT32LE 0x22000000 + (imm % 16)
  - name: membar
    max_bytes: 4
    body: |
      EMIT32LE 0x23000000
  - name: shfl
    max_bytes: 4
    body: |
      EMIT32LE 0x30000000 + dst*256 + a*65536 + b*131072
  - name: vote
    max_bytes: 4
    body: |
      EMIT32LE 0x31000000 + dst*256 + src*65536
  - name: fadd
    max_bytes: 4
    body: |
      EMIT32LE 0x81000000 + dst*256 + a*65536 + b*131072
  - name: fmul
    max_bytes: 4
    body: |
      EMIT32LE 0x81020000 + dst*256 + a*65536 + b*131072
  - name: mma
    max_bytes: 8
    body: |
      EMIT64LE 0x4000000000000000 + dst*16777216
forms:
  - mnemonic: nop
    encoder: nop
  - mnemonic: mov
    encoder: mov
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
