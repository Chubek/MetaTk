# nvptx.dsymspec.yaml
# Migrated from the Lua DSL (nvptx.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# nvptx.dsymspec — NVIDIA PTX virtual GPU ISA (sm_80), kernel ABI.
# PTX is a textual virtual ISA; registers are typed/unbounded virtual
# registers (%r32/%rd64/%f32/%f64/%p8 + specials). Instruction encodings
# below are representative SASS-level words, not bit-exact. Cross-checked
# via arch_oracle + ccbe_oracle SIMT/vector-ISA topics + toolchain_orace.
# Strata: base | sm_70 | sm_80 | sm_90 | mma/wmma | cp.async | shfl/vote |
#   atomics | priv.

schema: 1
targets:
  - {arch: nvptx, subarch: sm_80, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ptx, abi: NVPTX, calling_conv: nvptx-kernel, features: [base, sm_80, shfl]}
features:
  - {name: base, desc: "PTX base integer + moves + branches"}
  - {name: sm_50, desc: "compute capability 5.0"}
  - {name: sm_70, desc: "compute capability 7.0"}
  - {name: sm_80, desc: "compute capability 8.0"}
  - {name: sm_90, desc: "compute capability 9.0 (wgmma/dist)"}
  - {name: mma, desc: "matrix multiply-accumulate"}
  - {name: wmma, desc: "warp matrix ops"}
  - {name: cp.async, desc: "asynchronous copy"}
  - {name: shfl, desc: "warp shuffle"}
  - {name: vote, desc: "warp vote"}
  - {name: atomics, desc: "atomics (atom.add/cas)"}
  - {name: fp16, desc: half-precision}
  - {name: bf16, desc: "brain float 16"}
  - {name: priv, desc: "privileged (cluster/barrier cluster)"}
registers:
