    flags: [terminator]
  - mnemonic: bar.sync
    encoder: bar
    operands:
      - {kind: imm, width: 8, imm_min: 0, imm_max: 15, signed: false}
  - mnemonic: membar
    encoder: membar
  - mnemonic: shfl
    encoder: shfl
    required: [shfl]
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: vote
    encoder: vote
    required: [vote]
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
