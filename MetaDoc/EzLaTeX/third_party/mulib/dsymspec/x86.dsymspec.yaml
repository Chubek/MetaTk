syntaxes:
  - {name: intel, comment: ";", separator: ", "}
  - {name: att, order: 1, reg_prefix: "%", imm_prefix: "$", comment: "#", separator: ", "}
sections:
  - {name: ".text", flags: [exec, alloc, code], align: 16, content: code}
  - {name: ".rodata", flags: [alloc, readonly, data], align: 8, content: data}
  - {name: ".data", flags: [write, alloc, data], align: 8, content: data}
  - {name: ".bss", flags: [write, alloc, zerofill, data], align: 8, content: data}
  - {name: ".tdata", flags: [write, alloc, tls, data], align: 8, content: data}
  - {name: ".tbss", flags: [write, alloc, zerofill, tls, data], align: 8, content: data}
  - {name: ".init", flags: [exec, alloc, code], align: 16, content: code}
  - {name: ".fini", flags: [exec, alloc, code], align: 16, content: code}
  - {name: ".plt", flags: [exec, alloc, code], align: 16, content: code}
  - {name: ".got", flags: [write, alloc, data], align: 8, content: data}
  - {name: ".eh_frame", flags: [alloc, readonly, data], align: 8, content: data}
  - {name: ".comment", flags: [merge, readonly, meta], align: 1, content: meta}
linkages:
  - {name: func_global, binding: global, visibility: default, symtype: func}
  - {name: func_weak, binding: weak, visibility: default, symtype: func}
  - {name: object_global, binding: global, visibility: default, symtype: object}
  - {name: tls_var, binding: tls, visibility: default, symtype: object}
  - {name: local_sym, binding: local, visibility: default, symtype: none}
  - {name: hidden_func, binding: global, visibility: hidden, symtype: func}
relocs:
  - {name: R_386_NONE, width: 32, expr: "S + A"}
  - {name: R_386_32, width: 32, expr: "S + A"}
  - {name: R_386_PC8, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_386_PC16, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_386_PC32, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_386_PLT32, width: 32, signed: true, pcrel: true, expr: "PLT(S) + A - P"}
  - {name: R_386_GOT32, width: 32, expr: "GOT(S) + A"}
  - {name: R_386_GOTPC, width: 32, pcrel: true, expr: "GOT + A - P"}
  - {name: R_386_GOTOFF, width: 32, expr: "S + A - GOT"}
  - {name: R_386_GOT32X, width: 32, expr: "GOT(S) + A"}
  - {name: R_386_TLS_GD, width: 32, pcrel: true, expr: "TLS(S) + A - P"}
  - {name: R_386_TLS_LD, width: 32, pcrel: true, expr: "TLS(S) + A - P"}
  - {name: R_386_TLS_TPOFF32, width: 32, expr: "TLS(S) + A"}
  - {name: R_386_TLS_DTPOFF32, width: 32, expr: "TLS(S) + A"}
  - {name: R_386_GLOB_DAT, width: 32, expr: S}
  - {name: R_386_JMP_SLOT, width: 32, expr: S}
  - {name: R_386_RELATIVE, width: 32, expr: "B + A"}
  - {name: R_386_IRELATIVE, width: 32, expr: "B + A"}
  - {name: R_386_COPY, width: 32, expr: S}
debug:
  - {kind: target, ref: "", msg: "i386 base + bmi + sse/avx/fma + aes + x87 + priv"}
  - {kind: form, ref: vaddps, msg: "vector forms require sse/avx/fma"}
  - {kind: form, ref: cli, msg: "privileged forms require priv"}
backend:
  file: backend/x86.json
