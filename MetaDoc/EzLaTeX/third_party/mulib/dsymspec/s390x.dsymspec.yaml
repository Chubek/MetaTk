# s390x.dsymspec.yaml
# Migrated from the Lua DSL (s390x.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# s390x.dsymspec — IBM z/Architecture (s390x), big-endian, ELFv2 ABI.
# Data: TableGen SystemZ target (GR64 R0-R15, FP F0-F15, VR V0-V31, AR
# A0-A15, CC/FPC status, PSW), arch_oracle s390x summary (variable-length
# 2/4/6-byte instructions), osdev_oracle (z/Architecture priv facilities),
# toolchain_orace (R_390_* ELF relocations).
# Strata: base | high-word | distinct-ops | load-store-on-cond |
#   vector | dfp | tx | misc-ext | priv.

schema: 1
targets:
  - {arch: s390x, subarch: "z/arch", addr_size: 64, op_size: 32, addr_def: 64, align: 2, byte_order: big, obj_format: ELF64, abi: s390x-ELF, calling_conv: s390x-elf, features: [base, high-word, distinct-ops]}
features:
  - {name: base, desc: "z/Architecture base (RR/RX/S/SI)"}
  - {name: high-word, desc: "high-word facility"}
  - {name: distinct-ops, desc: "distinct-operands facility"}
  - {name: load-store-on-cond, desc: "load/store on condition"}
  - {name: misc-ext, desc: "miscellaneous-instruction extensions"}
  - {name: vector, desc: "vector facility (SIMD)"}
  - {name: dfp, desc: "decimal floating point"}
  - {name: tx, desc: "transactional execution"}
  - {name: dfp-zoned, desc: "decimal zoned conversion"}
  - {name: crypto, desc: "message-security assist (CPACF)"}
  - {name: priv, desc: "privileged (PSW/control regs)"}
