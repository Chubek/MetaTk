  - name: xr
    max_bytes: 2
    body: |
      EMIT16BE 0x1700 + r1*256 + r2
  - name: clr
    max_bytes: 2
    body: |
      EMIT16BE 0x1500 + r1*256 + r2
  - name: lgr
    max_bytes: 4
    body: |
      EMIT32BE 0xB9040000 + r1*4096 + r2
  - name: agr
    max_bytes: 4
    body: |
      EMIT32BE 0xB9080000 + r1*4096 + r2
  - name: sgr
    max_bytes: 4
    body: |
      EMIT32BE 0xB9090000 + r1*4096 + r2
  - name: msr
    max_bytes: 4
    body: |
      EMIT32BE 0xB2520000 + r1*4096 + r2
  - name: lghi
    max_bytes: 4
    body: |
      EMIT32BE 0xA7090000 + r1*4096 + ((imm + 32768) % 65536)
  - name: aghi
    max_bytes: 4
    body: |
      EMIT32BE 0xA70B0000 + r1*4096 + ((imm + 32768) % 65536)
  - name: chi
    max_bytes: 4
    body: |
      EMIT32BE 0xA70E0000 + r1*4096 + ((imm + 32768) % 65536)
  - name: l
    max_bytes: 4
    body: |
      EMIT32BE 0x58000000 + r1*4096 + r2*65536
  - name: st
    max_bytes: 4
    body: |
      EMIT32BE 0x50000000 + r1*4096 + r2*65536
  - name: la
    max_bytes: 4
    body: |
      EMIT32BE 0x41000000 + r1*4096 + r2*65536
  - name: lg
    max_bytes: 6
    body: |
      EMIT32BE 0xE3000000 + r1*4096 + r2*65536 + 4
  - name: stg
    max_bytes: 6
    body: |
      EMIT32BE 0xE3000000 + r1*4096 + r2*65536 + 36
  - name: sll
    max_bytes: 4
    body: |
      EMIT32BE 0x89000000 + r1*4096 + r2*65536
  - name: srl
    max_bytes: 4
    body: |
      EMIT32BE 0x88000000 + r1*4096 + r2*65536
  - name: cli
    max_bytes: 4
    body: |
      EMIT32BE 0x95000000 + r2*65536 + (imm % 256)
  - name: mvi
    max_bytes: 4
    body: |
      EMIT32BE 0x92000000 + r2*65536 + (imm % 256)
  - name: br
    max_bytes: 2
    body: |
      EMIT16BE 0x07F0 + r1
  - name: bcr
    max_bytes: 2
    body: |
      EMIT16BE 0x0700 + m*256 + r1
  - name: ret
    max_bytes: 2
    body: |
      EMIT16BE 0x07FE
  - name: basr
    max_bytes: 2
    body: |
      EMIT16BE 0x0D00 + r1*256 + r2
  - name: brasl
    max_bytes: 6
    max_relocs: 1
    body: |
      EMIT8 0xC0
      EMIT8 r1*16 + 5
      EMIT32BE 0
      EMIT_RELOCATION sym, R_390_PLT32DBL
  - name: brcl
    max_bytes: 6
    max_relocs: 1
    body: |
      EMIT8 0xC0
      EMIT8 m*16 + 4
      EMIT32BE 0
      EMIT_RELOCATION sym, R_390_PC32DBL
  - name: svc
    max_bytes: 2
    body: |
      EMIT16BE 0x0A00 + (imm % 256)
  - name: diag
    max_bytes: 4
    body: |
      EMIT32BE 0x83000000 + r1*4096 + r2*65536
  - name: lpsw
    max_bytes: 4
    body: |
      EMIT32BE 0x82000000 + r2*65536
  - name: sck
    max_bytes: 4
    body: |
      EMIT32BE 0xB2040000 + r2*65536
  - name: adbr
    max_bytes: 2
    body: |
      EMIT16BE 0xB30A + f1*256 + f2
  - name: vadd
    max_bytes: 6
    body: |
      EMIT32BE 0xE7F10000 + v1*4096 + v2*16 + v3
  - name: vst
    max_bytes: 6
    body: |
      EMIT32BE 0xE70E0000 + v1*4096 + r2*65536
  - name: adtr
    max_bytes: 4
    body: |
      EMIT32BE 0xB3F60000 + f1*256 + f2
  - name: tbegin
    max_bytes: 6
    body: |
      EMIT32BE 0xE5600000 + r2*65536
  - name: tend
    max_bytes: 2
    body: |
      EMIT16BE 0xB2F8
  - name: km
    max_bytes: 4
    body: |
      EMIT32BE 0xB92E0000 + r1*256 + r2
