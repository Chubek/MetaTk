encoders:
  # RR/RRE/RI/RX/RXY/RS/SI/S/RIL skeletons (big-endian).
  - name: nop
    max_bytes: 2
    body: |
      EMIT16BE 0x0700
  - name: lr
    max_bytes: 2
    body: |
      EMIT16BE 0x1800 + r1*256 + r2
  - name: ar
    max_bytes: 2
    body: |
      EMIT16BE 0x1A00 + r1*256 + r2
  - name: sr
    max_bytes: 2
    body: |
