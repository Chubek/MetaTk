# aarch64.dsymspec.yaml
# Migrated from the Lua DSL (aarch64.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# aarch64.dsymspec — AArch64 (ARMv8-A/ARMv9-A A64), AAPCS64 ABI.
# Data: TableGen AArch64RegisterInfo.td (GPR64/GPR32/GPR64common, FPR8/16/32/
# 64/128, PPR; XZR/WZR, LR/FP/SP, NZCV/FPSR/FPCR) and AArch64Features.td
# (neon/FPARMv8, sve/sve2, sme/sme2, aes/sha2/crc/lse/bf16/cssc/flagm/mte),
# cross-checked via tablegen_inquiry + arch_oracle + isa_reference AArch64
# quick spec (X0-X7 args, X29 FP, X30 LR, V0-V31 B/H/S/D/Q views).
# Operand names: rd, rn, rm, imm, sym.
# Strata: base | fp/neon | sve/sve2 | sme | crypto/hash/crc | lse | rcpc |
#   paca/bti | mte | priv/system.

schema: 1
targets:
  - {arch: aarch64, subarch: armv8-a, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ELF64, abi: AAPCS64, calling_conv: aapcs64, features: [base, fp, neon, lse, crc]}
features:
  - {name: base, desc: "A64 base integer + branches + loads"}
  - {name: fp, desc: "Armv8 floating point (FEAT_FP)"}
  - {name: neon, desc: "Advanced SIMD (NEON, FEAT_AdvSIMD)"}
  - {name: aes, desc: "AES cryptography (FEAT_AES)"}
  - {name: sha2, desc: "SHA1/SHA2 cryptography"}
  - {name: sha3, desc: "SHA3/SHA512 cryptography"}
  - {name: sm4, desc: "SM3/SM4 cryptography"}
  - {name: lse, desc: "Large System Extensions (atomics, FEAT_LSE)"}
  - {name: crc, desc: "CRC32 checksum (FEAT_CRC32)"}
  - {name: rcpc, desc: "RCpc load-acquire/store-release"}
  - {name: fp16, desc: "half-precision floating point"}
  - {name: bf16, desc: "BFloat16 (FEAT_BF16)"}
  - {name: i8mm, desc: "int8 matrix multiply"}
  - {name: sve, desc: "Scalable Vector Extension (FEAT_SVE)"}
  - {name: sve2, desc: "Scalable Vector Extension 2"}
  - {name: sme, desc: "Scalable Matrix Extension (FEAT_SME)"}
  - {name: sme2, desc: "Scalable Matrix Extension 2"}
  - {name: paca, desc: "pointer authentication (FEAT_PAC)"}
  - {name: bti, desc: "branch target identification (FEAT_BTI)"}
  - {name: mte, desc: "memory tagging (FEAT_MTE)"}
  - {name: ls64, desc: "64-byte atomic loads/stores (FEAT_LS64)"}
  - {name: cssc, desc: "common short sequence compression"}
  - {name: flagm, desc: "flag manipulation (FEAT_FlagM)"}
  - {name: rng, desc: "random number (FEAT_RNG)"}
  - {name: dp, desc: "dot product (FEAT_DotProd)"}
  - {name: jscvt, desc: "JS convert to float"}
  - {name: frintts, desc: "float round to int (FEAT_FRINTTS)"}
  - {name: sb, desc: "speculation barrier (FEAT_SB)"}
  - {name: ssbs, desc: "speculative store bypass safe (FEAT_SSBS)"}
  - {name: predres, desc: "prediction restriction (FEAT_PREDRES)"}
  - {name: priv, desc: "privileged system instructions"}
