  - {name: R_AARCH64_LDST128_ABS_LO12_NC, width: 32, expr: "S + A"}
  - {name: R_AARCH64_MOVW_UABS_G0_NC, width: 32, expr: "S + A"}
  - {name: R_AARCH64_MOVW_UABS_G1_NC, width: 32, expr: "S + A"}
  - {name: R_AARCH64_MOVW_UABS_G2_NC, width: 32, expr: "S + A"}
  - {name: R_AARCH64_MOVW_UABS_G3, width: 32, expr: "S + A"}
  - {name: R_AARCH64_GOTREL64, width: 64, expr: "GOT(S) + A"}
