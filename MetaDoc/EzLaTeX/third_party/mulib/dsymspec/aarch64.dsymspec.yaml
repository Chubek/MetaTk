encoders:
  # Encodings: shifts as multiplication (`<< 5` == *32, `<< 16` == *65536,
  # `<< 10` == *1024). Fixed 32-bit, little-endian. Bases from the ARM ARM.
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0xD503201F
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x8B000000 + rd + rn*32 + rm*65536
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0xCB000000 + rd + rn*32 + rm*65536
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x8A000000 + rd + rn*32 + rm*65536
  - name: orr
    max_bytes: 4
    body: |
      EMIT32LE 0xAA000000 + rd + rn*32 + rm*65536
  - name: eor
    max_bytes: 4
    body: |
      EMIT32LE 0xCA000000 + rd + rn*32 + rm*65536
  - name: mov
    max_bytes: 4
    body: |
      EMIT32LE 0xAA0003E0 + rd + 31*32 + rm*65536
  - name: movz
    max_bytes: 4
    body: |
      EMIT32LE 0xD2800000 + rd + ((imm + 65536) % 65536)*32
  - name: movk
    max_bytes: 4
    body: |
      EMIT32LE 0xF2800000 + rd + ((imm + 65536) % 65536)*32
  - name: addi
    max_bytes: 4
    body: |
      EMIT32LE 0x91000000 + rd + rn*32 + ((imm + 4096) % 4096)*1024
  - name: lsl
    max_bytes: 4
    body: |
      EMIT32LE 0xD3400000 + rd + rn*32 + ((imm + 64) % 64)*1024
  - name: lsr
    max_bytes: 4
    body: |
      EMIT32LE 0xD3400000 + rd + rn*32 + ((imm + 64) % 64)*1024 + 1024*64
  - name: asr
    max_bytes: 4
    body: |
      EMIT32LE 0xD3400000 + rd + rn*32 + ((imm + 64) % 64)*1024 + 1024*128
  - name: mul
    max_bytes: 4
    body: |
      EMIT32LE 0x9B007C00 + rd + rn*32 + rm*65536
  - name: sdiv
    max_bytes: 4
    body: |
      EMIT32LE 0x9AC00C00 + rd + rn*32 + rm*65536
  - name: cmp
    max_bytes: 4
    body: |
      EMIT32LE 0xEB00001F + rn*32 + rm*65536
  - name: ldr
    max_bytes: 4
    body: |
      EMIT32LE 0xF9400000 + rd + rn*32
  - name: str
    max_bytes: 4
    body: |
      EMIT32LE 0xF9000000 + rd + rn*32
  - name: ldp
    max_bytes: 4
    body: |
      EMIT32LE 0xA9400000 + rd + rn*32 + rm*1048576
  - name: stp
    max_bytes: 4
    body: |
      EMIT32LE 0xA9000000 + rd + rn*32 + rm*1048576
  - name: ldrb
    max_bytes: 4
    body: |
      EMIT32LE 0x39400000 + rd + rn*32
  - name: strb
    max_bytes: 4
    body: |
      EMIT32LE 0x39000000 + rd + rn*32
  - name: adrp
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x90000000 + rd
      EMIT_RELOCATION sym, R_AARCH64_ADR_PREL_PG_HI21
  - name: adr
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x10000000 + rd
      EMIT_RELOCATION sym, R_AARCH64_PREL32
  - name: ret
    max_bytes: 4
    body: |
      EMIT32LE 0xD65F03C0
  - name: br
    max_bytes: 4
    body: |
      EMIT32LE 0xD61F0000 + rn*32
  - name: blr
    max_bytes: 4
    body: |
      EMIT32LE 0xD63F0000 + rn*32
  - name: b
    max_bytes: 4
    max_relocs: 1
    body: |
