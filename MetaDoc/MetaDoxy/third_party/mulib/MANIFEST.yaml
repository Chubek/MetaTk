name: MuLIB
version: 0.1.0
language: C11
header_only: true
implementation_model: Define MULIB_IMPL_<MODULE> in exactly one translation unit before include.
inspiration:
- ctl (user-supplied)
- klib (user-supplied)
license: MIT
module_count: 120
modules:
