    encoder: mov
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 255, signed: false}
  - mnemonic: mvn
    encoder: mvn
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 255, signed: false}
  - mnemonic: cmp
    encoder: cmp
    operands:
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: tst
    encoder: tst
    operands:
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: lsl
    encoder: lsl
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: imm, width: 8, imm_min: 0, imm_max: 31, signed: false}
  - mnemonic: mul
    encoder: mul
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: mla
    encoder: mla
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: sdiv
    encoder: sdiv
    flags: [may_trap]
    required: [hwdiv]
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
