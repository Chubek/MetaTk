encoders:
  # ARM-state encodings (cond AL=0xE prefix folded into base).
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0xE1A00000
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0xE0800000 + rd*4096 + rn*65536 + rm
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0xE0400000 + rd*4096 + rn*65536 + rm
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0xE0000000 + rd*4096 + rn*65536 + rm
  - name: orr
    max_bytes: 4
    body: |
      EMIT32LE 0xE1800000 + rd*4096 + rn*65536 + rm
  - name: eor
    max_bytes: 4
    body: |
      EMIT32LE 0xE0200000 + rd*4096 + rn*65536 + rm
  - name: mov
    max_bytes: 4
    body: |
      EMIT32LE 0xE3A00000 + rd*4096 + (imm % 256)
  - name: mvn
    max_bytes: 4
    body: |
      EMIT32LE 0xE3E00000 + rd*4096 + (imm % 256)
  - name: cmp
    max_bytes: 4
    body: |
      EMIT32LE 0xE1500000 + rn*65536 + rm
  - name: tst
    max_bytes: 4
    body: |
      EMIT32LE 0xE1100000 + rn*65536 + rm
  - name: lsl
    max_bytes: 4
    body: |
      EMIT32LE 0xE1A00000 + rd*4096 + rm + ((imm % 32)*128)
  - name: mul
    max_bytes: 4
    body: |
      EMIT32LE 0xE0000090 + rd*65536 + rm*256 + rn
  - name: mla
    max_bytes: 4
    body: |
      EMIT32LE 0xE0200090 + rd*65536 + rm*256 + rn + ra*4096
  - name: sdiv
    max_bytes: 4
    body: |
      EMIT32LE 0xE710F010 + rd*65536 + rm*256 + rn
  - name: ldr
    max_bytes: 4
    body: |
      EMIT32LE 0xE5900000 + rd*4096 + rn*65536
  - name: str
    max_bytes: 4
    body: |
      EMIT32LE 0xE5800000 + rd*4096 + rn*65536
  - name: ldrb
    max_bytes: 4
    body: |
      EMIT32LE 0xE5D00000 + rd*4096 + rn*65536
  - name: strb
    max_bytes: 4
    body: |
      EMIT32LE 0xE5C00000 + rd*4096 + rn*65536
  - name: ldm
    max_bytes: 4
    body: |
      EMIT32LE 0xE8900000 + rn*65536 + rlist
  - name: stm
    max_bytes: 4
    body: |
      EMIT32LE 0xE8800000 + rn*65536 + rlist
  - name: bx
    max_bytes: 4
    body: |
      EMIT32LE 0xE12FFF10 + rm
  - name: blx
    max_bytes: 4
    body: |
      EMIT32LE 0xE12FFF30 + rm
  - name: b
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0xEA000000
      EMIT_RELOCATION sym, R_ARM_JUMP24
  - name: bl
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0xEB000000
      EMIT_RELOCATION sym, R_ARM_CALL
  - name: svc
    max_bytes: 4
    body: |
      EMIT32LE 0xEF000000 + (imm % 16777216)
  - name: mrs
    max_bytes: 4
    body: |
      EMIT32LE 0xE10F0000 + rd*4096
  - name: msr
    max_bytes: 4
    body: |
      EMIT32LE 0xE129F000 + rn
  - name: dmb
    max_bytes: 4
    body: |
      EMIT32LE 0xF57FF050
  - name: clrex
    max_bytes: 4
    body: |
      EMIT32LE 0xF57FF01F
  - name: ldrexd
    max_bytes: 4
    body: |
      EMIT32LE 0xE1B00F9F + rd*4096 + rn*65536
  - name: tadd
    max_bytes: 2
    body: |
      EMIT16LE 0x1800 + rd + rn*8 + rm*64
  - name: tcbz
    max_bytes: 2
    max_relocs: 1
    body: |
      EMIT16LE 0xB100 + rn
      EMIT_RELOCATION sym, R_ARM_THM_JUMP6
  - name: fadds
    max_bytes: 4
    body: |
      EMIT32LE 0xEE300A00 + rd*1024 + rn*65536 + rm*32
  - name: fmuls
    max_bytes: 4
    body: |
      EMIT32LE 0xEE200A00 + rd*1024 + rn*65536 + rm*32
  - name: vadd
    max_bytes: 4
    body: |
      EMIT32LE 0xF2000800 + rd*1024 + rn*65536 + rm*32
  - name: vld1
    max_bytes: 4
    body: |
      EMIT32LE 0xF4200000 + rd*1024 + rn*65536
  - name: aese
    max_bytes: 4
    body: |
      EMIT32LE 0xF3B00300 + rd*1024 + rn*131072
  - name: crc32b
    max_bytes: 4
    body: |
      EMIT32LE 0xE1400000 + rd*4096 + rn*65536 + rm
  - name: sadd16
    max_bytes: 4
    body: |
      EMIT32LE 0xE61000F0 + rd*4096 + rn*65536 + rm
  - name: smlabb
    max_bytes: 4
    body: |
      EMIT32LE 0xE1000080 + rd*65536 + rm*256 + rn + ra*4096
forms:
  - mnemonic: nop
    encoder: nop
  - mnemonic: add
    encoder: add
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: sub
    encoder: sub
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: and
    encoder: and
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: orr
    encoder: orr
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
