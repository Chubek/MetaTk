# arm32.dsymspec.yaml
# Migrated from the Lua DSL (arm32.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# arm32.dsymspec — ARMv7-A AArch32 (ARM + Thumb-2), AAPCS32 ABI.
# Data: TableGen ARMRegisterInfo.td (GPR R0-R12/SP/LR/PC, SPR S0-S31,
# DPR D0-D31, QPR Q0-Q15, GPRPair, CPSR/SPSR) + ARMFeatures.td (VFP2, NEON,
# Thumb2, DSP, TrustZone, MP, PACBTI, FP16, FullFP16, FP16FML, BF16, CRC,
# Crypto, DotProd), cross-checked via tablegen_inquiry + toolchain_orace
# (ARM ELF relocations) + ccbe_oracle ABI topics.
# Strata: base(ARM) | thumb/thumb2 | vfp | neon | dsp | crypto/crc | priv.

schema: 1
targets:
  - {arch: arm32, subarch: armv7-a, addr_size: 32, op_size: 32, addr_def: 32, align: 4, byte_order: little, obj_format: ELF32, abi: AAPCS32, calling_conv: aapcs, features: [base, vfpv2, thumb, thumb2]}
features:
  - {name: base, desc: "ARM base integer (ARM state)"}
  - {name: vfpv2, desc: VFPv2}
  - {name: vfpv3, desc: VFPv3}
  - {name: vfpv4, desc: "VFPv4 (fused MAC)"}
  - {name: neon, desc: "Advanced SIMD (NEON)"}
  - {name: thumb, desc: "Thumb instruction set"}
  - {name: thumb2, desc: Thumb-2}
  - {name: dsp, desc: "DSP extension"}
  - {name: trustzone, desc: TrustZone}
  - {name: mp, desc: "multiprocessing extension"}
  - {name: crypto, desc: "cryptography (AES+SHA2+NEON)"}
  - {name: crc, desc: CRC32}
  - {name: dotprod, desc: "dot product (UDOT)"}
  - {name: fp16, desc: half-precision}
  - {name: fullfp16, desc: "full half-precision"}
  - {name: fp16fml, desc: "FP16 FML"}
  - {name: bf16, desc: BFloat16}
  - {name: pacbti, desc: "pointer auth + branch target id"}
  - {name: hwdiv, desc: "hardware divide (UDIV/SDIV)"}
  - {name: virt, desc: "virtualization extensions"}
  - {name: priv, desc: "privileged system"}
