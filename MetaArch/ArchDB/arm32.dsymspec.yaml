  - {name: R_ARM_CALL, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_THM_JUMP24, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_THM_JUMP6, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_THM_CALL, width: 32, signed: true, pcrel: true, expr: "PLT(S) + A - P"}
  - {name: R_ARM_MOVW_ABS_NC, width: 32, expr: "S + A"}
  - {name: R_ARM_MOVT_ABS, width: 32, expr: "S + A"}
  - {name: R_ARM_MOVW_PREL_NC, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_MOVT_PREL, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_GOT32, width: 32, expr: "GOT(S) + A"}
  - {name: R_ARM_GOT_PREL, width: 32, signed: true, pcrel: true, expr: "GOT(S) + A - P"}
  - {name: R_ARM_TLS_GD32, width: 32, expr: "TLS(S) + A"}
  - {name: R_ARM_TLS_IE32, width: 32, expr: "TLS(S) + A"}
  - {name: R_ARM_TLS_LE32, width: 32, expr: "TLS(S) + A"}
  - {name: R_ARM_GLOB_DAT, width: 32, expr: S}
  - {name: R_ARM_JUMP_SLOT, width: 32, expr: S}
  - {name: R_ARM_RELATIVE, width: 32, expr: "B + A"}
  - {name: R_ARM_PREL31, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_ARM_TARGET1, width: 32, expr: "S + A"}
  - {name: R_ARM_V4BX, width: 32, expr: "S + A"}
debug:
