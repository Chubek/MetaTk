mnemonics:
  - {name: s_nop}
  - {name: s_add}
  - {name: s_sub}
  - {name: s_and}
  - {name: s_or}
  - {name: s_mov}
  - {name: s_branch}
  - {name: s_cbranch}
  - {name: s_endpgm}
  - {name: s_waitcnt}
  - {name: s_barrier}
  - {name: s_load}
  - {name: s_store}
  - {name: s_getreg}
  - {name: v_add}
  - {name: v_sub}
  - {name: v_mul}
  - {name: v_mov}
  - {name: v_cmp}
  - {name: v_cndmask}
  - {name: flat_load}
  - {name: flat_store}
  - {name: ds_read}
  - {name: ds_write}
  - {name: buffer_load}
  - {name: buffer_store}
  - {name: image_load}
  - {name: mfma}
encoders:
  - name: s_nop
    max_bytes: 4
    body: |
      EMIT32LE 0xBF800000
  - name: s_add
    max_bytes: 4
    body: |
      EMIT32LE 0x81000000 + dst*16777216 + src0*256 + src1
  - name: s_sub
    max_bytes: 4
    body: |
      EMIT32LE 0x82000000 + dst*16777216 + src0*256 + src1
  - name: s_and
    max_bytes: 4
    body: |
      EMIT32LE 0x88000000 + dst*16777216 + src0*256 + src1
  - name: s_or
    max_bytes: 4
    body: |
      EMIT32LE 0x8A000000 + dst*16777216 + src0*256 + src1
  - name: s_mov
    max_bytes: 4
    body: |
      EMIT32LE 0xBE000000 + dst*16777216 + src0
  - name: s_branch
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0xBF800002
      EMIT_RELOCATION sym, R_AMDGPU_REL32
  - name: s_cbranch
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0xBF840000
      EMIT_RELOCATION sym, R_AMDGPU_REL32
  - name: s_endpgm
    max_bytes: 4
    body: |
      EMIT32LE 0xBF810000
  - name: s_waitcnt
    max_bytes: 4
    body: |
      EMIT32LE 0xBF8C0000 + imm
  - name: s_barrier
    max_bytes: 4
    body: |
      EMIT32LE 0xBF8A0000
  - name: s_load
    max_bytes: 4
    body: |
      EMIT32LE 0xC0000000 + dst*16777216 + src0*256
  - name: s_store
    max_bytes: 4
    body: |
      EMIT32LE 0xC8000000 + src0*256 + src1
  - name: s_getreg
    max_bytes: 4
    body: |
      EMIT32LE 0xB0000000 + dst*16777216 + src0
  - name: v_add
    max_bytes: 4
    body: |
      EMIT32LE 0x4A000000 + dst*16777216 + src0*256 + src1
  - name: v_sub
    max_bytes: 4
    body: |
      EMIT32LE 0x4A800000 + dst*16777216 + src0*256 + src1
  - name: v_mul
    max_bytes: 4
    body: |
      EMIT32LE 0x4C000000 + dst*16777216 + src0*256 + src1
  - name: v_mov
    max_bytes: 4
    body: |
      EMIT32LE 0x7E000000 + dst*16777216 + src0
  - name: v_cmp
    max_bytes: 4
    body: |
      EMIT32LE 0x4F000000 + src0*256 + src1
  - name: v_cndmask
    max_bytes: 4
    body: |
      EMIT32LE 0x4E000000 + dst*16777216 + src0*256 + src1
  - name: flat_load
    max_bytes: 8
    body: |
      EMIT64LE 0xDC50000000000000 + dst*16777216 + src0*4294967296
  - name: flat_store
    max_bytes: 8
    body: |
      EMIT64LE 0xDC70000000000000 + src0*4294967296 + src1*16777216
  - name: ds_read
    max_bytes: 4
    body: |
      EMIT32LE 0xD8000000 + dst*16777216 + src0*256
  - name: ds_write
    max_bytes: 4
    body: |
      EMIT32LE 0xD9000000 + src0*256 + src1
  - name: buffer_load
    max_bytes: 4
    body: |
      EMIT32LE 0xE0000000 + dst*16777216 + src0*256
  - name: buffer_store
    max_bytes: 4
    body: |
      EMIT32LE 0xE8000000 + src0*256 + src1
  - name: image_load
    max_bytes: 4
    body: |
      EMIT32LE 0xF0000000 + dst*16777216 + src0*256
  - name: mfma
    max_bytes: 8
    body: |
      EMIT64LE 0xD000000000000000 + dst*16777216 + src0*4294967296
forms:
  - mnemonic: s_nop
    encoder: s_nop
  - mnemonic: s_add
    encoder: s_add
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
