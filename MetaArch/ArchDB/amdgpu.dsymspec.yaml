# amdgpu.dsymspec.yaml
# Migrated from the Lua DSL (amdgpu.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# amdgpu.dsymspec — AMD GCN/RDNA/CDNA (AMDGPU HSA kernel ABI).
# Encodings are representative 32/64-bit SOP/VOP/FLAT words, not bit-exact;
# register file (SGPR/VGPR/AGPR + EXEC/VCC/SCC/M0 + flat_scratch), features
# (GCN/RDNA/CDNA, wave32/64, FLAT, XNACK), and HSA sections/relocations are
# accurate. Cross-checked via TableGen AMDGPU target + arch_oracle +
# ccbe_oracle SIMT/vector-ISA topics.
# Strata: base(sop) | vop | flat | ds(buffer) | image | cdna-mfma | priv.

schema: 1
targets:
  - {arch: amdgpu, subarch: gfx900, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ELF64, abi: amdgpu-HSA, calling_conv: amdgpu-hsa-kernel, features: [base, gcn, wave64]}
features:
  - {name: base, desc: "scalar SOP base"}
  - {name: gcn, desc: "Graphics Core Next"}
  - {name: rdna, desc: RDNA}
  - {name: cdna, desc: "CDNA (matrix cores)"}
  - {name: wave32, desc: "32-lane wavefront"}
  - {name: wave64, desc: "64-lane wavefront"}
  - {name: flat, desc: "flat addressing (FLAT/GLOBAL)"}
  - {name: xnack, desc: "execute-mask XNACK"}
  - {name: priv, desc: "privileged (s_getreg/s_setreg)"}
  - {name: image, desc: "image/memory ops (MUBUF/MTBUF/MIMG)"}
  - {name: mfma, desc: "matrix-fused multiply-add (CDNA)"}
registers:
  - {name: s0, class: gpr, width: 32, enc: 0, flags: [readable, writable]}
  - {name: s1, class: gpr, width: 32, enc: 1, flags: [readable, writable]}
