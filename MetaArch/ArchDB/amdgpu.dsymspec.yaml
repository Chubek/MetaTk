      - {kind: reg, class: gpr, width: 32}
  - mnemonic: v_mul
    encoder: v_mul
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: v_mov
    encoder: v_mov
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: v_cmp
    encoder: v_cmp
    operands:
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: v_cndmask
    encoder: v_cndmask
