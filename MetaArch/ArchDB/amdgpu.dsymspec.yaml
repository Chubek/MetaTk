  - {name: R_AMDGPU_ABS64, width: 64, expr: "S + A"}
  - {name: R_AMDGPU_REL32, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_AMDGPU_GOT, width: 64, expr: "GOT(S) + A"}
  - {name: R_AMDGPU_RELATIVE, width: 64, expr: "B + A"}
