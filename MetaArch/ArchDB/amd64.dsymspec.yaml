encoders:
  # Legacy/REX.W encodings. emit_modrm(dst,src) -> mod=11 reg=dst rm=src.
  - name: nop
    max_bytes: 1
    body: |
      EMIT8 0x90
  - name: ret
    max_bytes: 1
    body: |
      EMIT8 0xC3
  - name: mov
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x89
      EMIT_MODRM src, dst
  - name: movimm
    max_bytes: 10
    body: |
      EMIT8 0x48
      EMIT8 0xB8 + dst
      EMIT_IMM 8, imm
  - name: movzx
    max_bytes: 4
    body: |
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xB7
      EMIT_MODRM src, dst
  - name: movsx
    max_bytes: 4
    body: |
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xBF
      EMIT_MODRM src, dst
  - name: xchg
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x87
      EMIT_MODRM src, dst
  - name: lea
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x8D
      EMIT_MODRM dst, src
  - name: add
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x01
      EMIT_MODRM src, dst
  - name: sub
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x29
      EMIT_MODRM src, dst
  - name: and
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x21
      EMIT_MODRM src, dst
  - name: or
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x09
      EMIT_MODRM src, dst
  - name: xor
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x31
      EMIT_MODRM src, dst
  - name: adc
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x11
      EMIT_MODRM src, dst
  - name: sbb
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x19
      EMIT_MODRM src, dst
  - name: cmp
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x39
      EMIT_MODRM src, dst
  - name: test
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0x85
      EMIT_MODRM src, dst
  - name: inc
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xFF
      EMIT_MODRM 0, dst
  - name: dec
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xFF
      EMIT_MODRM 1, dst
  - name: neg
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xF7
      EMIT_MODRM 3, dst
  - name: not
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xF7
      EMIT_MODRM 2, dst
  - name: imul
    max_bytes: 4
    body: |
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xAF
      EMIT_MODRM dst, src
  - name: div
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xF7
      EMIT_MODRM 6, src
  - name: idiv
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xF7
      EMIT_MODRM 7, src
  - name: shl
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xD3
      EMIT_MODRM 4, dst
  - name: shr
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xD3
      EMIT_MODRM 5, dst
  - name: sar
    max_bytes: 3
    body: |
      EMIT8 0x48
      EMIT8 0xD3
      EMIT_MODRM 7, dst
  - name: andn
    max_bytes: 5
    body: |
      EMIT8 0xC4
      EMIT8 0xE2
      EMIT8 0xF0
      EMIT_MODRM src, dst
      EMIT8 0xC0 + src2
  - name: popcnt
    max_bytes: 5
    body: |
      EMIT8 0xF3
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xB8
      EMIT_MODRM src, dst
  - name: tzcnt
    max_bytes: 5
    body: |
      EMIT8 0xF3
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xBC
      EMIT_MODRM src, dst
  - name: push
    max_bytes: 1
    body: |
      EMIT8 0x50 + dst
  - name: pop
    max_bytes: 1
    body: |
      EMIT8 0x58 + dst
  - name: pushf
    max_bytes: 1
    body: |
      EMIT8 0x9C
  - name: popf
    max_bytes: 1
    body: |
      EMIT8 0x9D
  - name: call
    max_bytes: 5
    max_relocs: 1
    body: |
      EMIT8 0xE8
      EMIT_IMM 4, 0
      EMIT_RELOCATION sym, R_X86_64_PLT32
  - name: jmp
    max_bytes: 5
    max_relocs: 1
    body: |
      EMIT8 0xE9
      EMIT_IMM 4, 0
      EMIT_RELOCATION sym, R_X86_64_PC32
  - name: jcc
    max_bytes: 6
    max_relocs: 1
    body: |
      EMIT8 0x0F
      EMIT8 0x80 + cond
      EMIT_IMM 4, 0
      EMIT_RELOCATION sym, R_X86_64_PC32
  - name: leave
    max_bytes: 1
    body: |
      EMIT8 0xC9
  - name: syscall
    max_bytes: 2
    body: |
      EMIT8 0x0F
      EMIT8 0x05
  - name: int
    max_bytes: 2
    body: |
      EMIT8 0xCD
      EMIT8 imm
  - name: cpuid
    max_bytes: 2
    body: |
      EMIT8 0x0F
      EMIT8 0xA2
  - name: movaps
    max_bytes: 3
    body: |
      EMIT8 0x0F
      EMIT8 0x28
      EMIT_MODRM src, dst
  - name: addps
    max_bytes: 3
    body: |
      EMIT8 0x0F
      EMIT8 0x58
      EMIT_MODRM src, dst
  - name: vaddps
    max_bytes: 5
    body: |
      EMIT8 0xC5
      EMIT8 0xF8
      EMIT8 0x58
      EMIT_MODRM src, dst
      EMIT8 0xC0 + src2
  - name: vfmadd
    max_bytes: 6
    body: |
      EMIT8 0xC4
      EMIT8 0xE2
      EMIT8 0x78
      EMIT8 0x98
      EMIT_MODRM src, dst
      EMIT8 0xC0 + src2
  - name: aesenc
    max_bytes: 5
    body: |
      EMIT8 0x66
      EMIT8 0x0F
      EMIT8 0x38
      EMIT8 0xDC
      EMIT_MODRM src, dst
  - name: fld
    max_bytes: 2
    body: |
      EMIT8 0xD9
      EMIT8 0x00 + dst
  - name: fadd
    max_bytes: 2
    body: |
      EMIT8 0xD8
      EMIT8 0xC0 + dst
  - name: rdrnd
    max_bytes: 4
    body: |
      EMIT8 0x48
      EMIT8 0x0F
      EMIT8 0xC7
      EMIT_MODRM 6, dst
  - name: cli
    max_bytes: 1
    body: |
      EMIT8 0xFA
  - name: sti
    max_bytes: 1
    body: |
      EMIT8 0xFB
  - name: hlt
    max_bytes: 1
    body: |
      EMIT8 0xF4
  - name: pause
    max_bytes: 2
    body: |
      EMIT8 0xF3
      EMIT8 0x90
