  - {name: fma, desc: FMA3}
  - {name: bmi1, desc: "Bit Manipulation Instruction Set 1"}
  - {name: bmi2, desc: "Bit Manipulation Instruction Set 2"}
  - {name: aes, desc: AES-NI}
  - {name: vaes, desc: "vector AES"}
  - {name: pclmulqdq, desc: "carry-less multiply"}
  - {name: popcnt, desc: POPCNT}
