# Executable bounded forms, consumed by tools/generate_asmtk.py. Shared opcode
# bytes come from the encoder bodies above; additional width/addressing forms
# live here, not in the assembler. REX, ModRM/SIB and fixup handling are mechanisms.
asmtk:
  schema: 1
  encodings:
    - {mnemonic: nop, form: Fixed, widths: [], encoder: nop}
    - {mnemonic: ret, form: Fixed, widths: [], encoder: ret}
    - {mnemonic: syscall, form: Fixed, widths: [], encoder: syscall}
    - {mnemonic: int3, form: Fixed, widths: [], opcode: [0xcc]}
    - {mnemonic: ud2, form: Fixed, widths: [], opcode: [0x0f, 0x0b]}
    - {mnemonic: cqo, form: Fixed, widths: [], opcode: [0x48, 0x99]}
    - {mnemonic: leave, form: Fixed, widths: [], encoder: leave}
    - {mnemonic: mov, form: RegisterRegister, widths: [32, 64], encoder: mov}
    - {mnemonic: mov, form: RegisterRegister, widths: [8], opcode: [0x88]}
    - {mnemonic: mov, form: Load, widths: [32, 64], opcode: [0x8b], reg_operand: 0}
    - {mnemonic: mov, form: Load, widths: [8], opcode: [0x8a], reg_operand: 0}
    - {mnemonic: mov, form: Store, widths: [32, 64], encoder: mov}
    - {mnemonic: mov, form: Store, widths: [8], opcode: [0x88]}
    - {mnemonic: mov, form: MoveImmediate, widths: [32, 64], encoder: movimm}
    - {mnemonic: mov, form: MoveImmediate, widths: [8], opcode: [0xb0]}
    - {mnemonic: lea, form: Load, widths: [32, 64], encoder: lea, reg_operand: 0}
    - {mnemonic: add, form: RegisterRegister, widths: [32, 64], encoder: add}
    - {mnemonic: sub, form: RegisterRegister, widths: [32, 64], encoder: sub}
    - {mnemonic: and, form: RegisterRegister, widths: [32, 64], encoder: and}
    - {mnemonic: or, form: RegisterRegister, widths: [32, 64], encoder: or}
    - {mnemonic: xor, form: RegisterRegister, widths: [32, 64], encoder: xor}
    - {mnemonic: cmp, form: RegisterRegister, widths: [32, 64], encoder: cmp}
    - {mnemonic: test, form: RegisterRegister, widths: [32, 64], encoder: test}
    - {mnemonic: imul, form: RegisterRegister, widths: [32, 64], encoder: imul}
    - {mnemonic: push, form: OpcodeRegister, widths: [64], encoder: push, rex_w: false}
    - {mnemonic: pop, form: OpcodeRegister, widths: [64], encoder: pop, rex_w: false}
    - {mnemonic: call, form: Indirect, widths: [64], opcode: [0xff], group: 2, rex_w: false}
    - {mnemonic: jmp, form: Indirect, widths: [64], opcode: [0xff], group: 4, rex_w: false}
    - {mnemonic: inc, form: Unary, widths: [32, 64], encoder: inc}
    - {mnemonic: dec, form: Unary, widths: [32, 64], encoder: dec}
    - {mnemonic: neg, form: Unary, widths: [32, 64], encoder: neg}
    - {mnemonic: not, form: Unary, widths: [32, 64], encoder: not}
    - {mnemonic: div, form: Unary, widths: [32, 64], encoder: div}
    - {mnemonic: idiv, form: Unary, widths: [32, 64], encoder: idiv}
    - {mnemonic: shl, form: ShiftCL, widths: [32, 64], encoder: shl, implicit_register: cl}
    - {mnemonic: shr, form: ShiftCL, widths: [32, 64], encoder: shr, implicit_register: cl}
    - {mnemonic: sar, form: ShiftCL, widths: [32, 64], encoder: sar, implicit_register: cl}
    - {mnemonic: shl, form: ShiftImmediate, widths: [32, 64], opcode: [0xc1], group: 4}
    - {mnemonic: shr, form: ShiftImmediate, widths: [32, 64], opcode: [0xc1], group: 5}
    - {mnemonic: sar, form: ShiftImmediate, widths: [32, 64], opcode: [0xc1], group: 7}
    - {mnemonic: add, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 0}
    - {mnemonic: or, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 1}
    - {mnemonic: and, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 4}
    - {mnemonic: sub, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 5}
    - {mnemonic: xor, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 6}
    - {mnemonic: cmp, form: ArithmeticImmediate, widths: [32, 64], opcode: [0x81], group: 7}
    - {mnemonic: call, form: Relative, widths: [], encoder: call, relocation: 4}
    - {mnemonic: jmp, form: Relative, widths: [], encoder: jmp, relocation: 2}
  # Condition encodings and aliases are architecture data, not assembler logic.
  conditions:
    - {code: 0, names: [jo]}
    - {code: 1, names: [jno]}
    - {code: 2, names: [jb, jc, jnae]}
    - {code: 3, names: [jae, jnc, jnb]}
    - {code: 4, names: [je, jz]}
    - {code: 5, names: [jne, jnz]}
    - {code: 6, names: [jbe, jna]}
    - {code: 7, names: [ja, jnbe]}
    - {code: 8, names: [js]}
    - {code: 9, names: [jns]}
    - {code: 10, names: [jp, jpe]}
    - {code: 11, names: [jnp, jpo]}
    - {code: 12, names: [jl, jnge]}
    - {code: 13, names: [jge, jnl]}
    - {code: 14, names: [jle, jng]}
    - {code: 15, names: [jg, jnle]}

# Audited value-only integer subset. These symbols do NOT denote machine
# instructions with observable flags. Backend records supply ties, predicates,
# flag definitions and processor scheduling costs; algebra uses wrapping BV64.
metachain:
  schema: 1
  scheduling_model: SkylakeClientModel
  register_class: GR64
  lowering: {copy: mov, return: ret, stack_pointer: rsp, accumulator: rax, scratch: rdx}
  allocation:
    reserved: [rsp, rbp]
    callee_saved: [rbx, rbp, r12, r13, r14, r15]
    arguments: [rdi, rsi, rdx, rcx, r8, r9]
    results: [rax, rdx]
    stack_alignment: 16
  values:
    - {symbol: add64, semantic: Add, mnemonic: add, instruction: ADD64rr, pattern: X86add_flag}
    - {symbol: sub64, semantic: Sub, mnemonic: sub, instruction: SUB64rr, pattern: X86sub_flag}
    - {symbol: mul64, semantic: Mul, mnemonic: imul, instruction: IMUL64rr, pattern: X86smul_flag}
    - {symbol: and64, semantic: And, mnemonic: and, instruction: AND64rr, pattern: X86and_flag}
    - {symbol: or64, semantic: Or, mnemonic: or, instruction: OR64rr, pattern: X86or_flag}
    - {symbol: xor64, semantic: Xor, mnemonic: xor, instruction: XOR64rr, pattern: X86xor_flag}
