  - {name: movbe, desc: MOVBE}
  - {name: rdrnd, desc: RDRAND}
  - {name: rdseed, desc: RDSEED}
  - {name: sha, desc: "SHA extensions"}
  - {name: gfni, desc: "Galois Field New Instructions"}
  - {name: fsgsbase, desc: FSGSBASE}
  - {name: adx, desc: "ADX multi-precision add"}
  - {name: rdpid, desc: RDPID}
  - {name: clflushopt, desc: CLFLUSHOPT}
  - {name: clwb, desc: CLWB}
  - {name: x87, desc: "x87 floating point stack"}
  - {name: mmx, desc: MMX}
  - {name: cet, desc: "Control-flow Enforcement (SHSTK+IBT)"}
  - {name: rtm, desc: "Restricted Transactional Memory"}
  - {name: sgx, desc: "Software Guard Extensions"}
  - {name: serialize, desc: SERIALIZE}
  - {name: uintr, desc: "user interrupts"}
  - {name: cldemote, desc: "cache line demote"}
  - {name: movdiri, desc: "MOVDIRI direct store"}
  - {name: waitpkg, desc: "UMONITOR/UMWAIT/TPAUSE"}
  - {name: clzero, desc: CLZERO}
  - {name: priv, desc: "privileged system instructions"}
