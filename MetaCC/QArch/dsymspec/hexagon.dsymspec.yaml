# hexagon.dsymspec.yaml
# Migrated from the Lua DSL (hexagon.dsymspec). Encoder bodies are imperative
# pseudo-code; the grammar is documented in README.md.
#
# hexagon.dsymspec — Qualcomm Hexagon VLIW DSP (packetized, little-endian).
# NOTE: Hexagon packet encoding is non-trivial (VLIW slots, duplex,
# end-of-packet bits). Register file, features, and ABI facts are accurate
# (TableGen Hexagon target: R0-R31, P0-P3, C/SA/LC/M/USR, Q/V 128B HVX);
# instruction encodings below are representative opcode words, not
# bit-exact. Cross-checked via arch_oracle + ccbe_oracle VLIW/scheduling
# topics (bundle scheduling, delay slots, modulo scheduling).
# Strata: base(v60) | v65 | v68 | hvx | hvx128 | audio | priv.

schema: 1
targets:
  - {arch: hexagon, subarch: v68, addr_size: 32, op_size: 32, addr_def: 32, align: 4, byte_order: little, obj_format: ELF32, abi: Hexagon, calling_conv: hexagon, features: [base, v60, v68]}
features:
  - {name: base, desc: "Hexagon base scalar"}
  - {name: v60, desc: "Hexagon V60"}
  - {name: v65, desc: "Hexagon V65"}
  - {name: v68, desc: "Hexagon V68"}
  - {name: hvx, desc: "Hexagon Vector eXtensions (128B)"}
  - {name: hvx128, desc: "HVX 128-byte"}
  - {name: audio, desc: "audio extensions"}
  - {name: duplex, desc: "duplex/sub-instruction"}
  - {name: compound, desc: "compound (new-value) jumps"}
  - {name: zreg, desc: "HVX temporaries"}
  - {name: priv, desc: "privileged (guest/supervisor)"}
