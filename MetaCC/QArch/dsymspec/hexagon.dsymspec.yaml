mnemonics:
  - {name: nop}
  - {name: add}
  - {name: sub}
  - {name: and}
  - {name: or}
  - {name: xor}
  - {name: addi}
  - {name: mpyi}
  - {name: memw.ld}
  - {name: memw.st}
  - {name: jump}
  - {name: jumpr}
  - {name: call}
  - {name: deallocreturn}
  - {name: trap}
  - {name: vadd}
  - {name: vmul}
  - {name: vld}
  - {name: vst}
encoders:
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0x7800C000
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x51000000 + rd*65536 + rs*2048 + rt
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0x51000040 + rd*65536 + rs*2048 + rt
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x52000000 + rd*65536 + rs*2048 + rt
  - name: or
    max_bytes: 4
    body: |
      EMIT32LE 0x52000040 + rd*65536 + rs*2048 + rt
  - name: xor
    max_bytes: 4
    body: |
      EMIT32LE 0x52000080 + rd*65536 + rs*2048 + rt
  - name: r_addi
    max_bytes: 4
    body: |
      EMIT32LE 0x39000000 + rd*65536 + rs*2048 + ((imm + 2048) % 4096)
  - name: mpyi
    max_bytes: 4
    body: |
      EMIT32LE 0x57000000 + rd*65536 + rs*2048 + ((imm + 2048) % 4096)
  - name: memwld
    max_bytes: 4
    body: |
      EMIT32LE 0x67000000 + rd*65536 + rs*2048
  - name: memwst
    max_bytes: 4
    body: |
      EMIT32LE 0x5F000000 + rs*65536 + rt*2048
  - name: jump
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x58000000
      EMIT_RELOCATION sym, R_HEX_B22_PCREL
  - name: jumpr
    max_bytes: 4
    body: |
      EMIT32LE 0x4E800000 + rs*2048
  - name: call
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x5A000000
      EMIT_RELOCATION sym, R_HEX_B22_PCREL
  - name: dealloc
    max_bytes: 4
    body: |
      EMIT32LE 0x6B000000 + rs*2048
  - name: trap
    max_bytes: 4
    body: |
      EMIT32LE 0x6B40C000 + (imm % 256)
  - name: vadd
    max_bytes: 4
    body: |
      EMIT32LE 0xE1000000 + rd*65536 + rs*2048 + rt
  - name: vmul
    max_bytes: 4
    body: |
      EMIT32LE 0xE1200000 + rd*65536 + rs*2048 + rt
  - name: vld
    max_bytes: 4
    body: |
      EMIT32LE 0xE3000000 + rd*65536 + rs*2048
  - name: vst
    max_bytes: 4
    body: |
      EMIT32LE 0xE3800000 + rs*65536 + rt*2048
forms:
  - mnemonic: nop
    encoder: nop
  - mnemonic: add
    encoder: add
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: sub
    encoder: sub
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: and
    encoder: and
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: or
    encoder: or
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: xor
    encoder: xor
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: addi
    encoder: r_addi
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: imm, width: 12, imm_min: -2048, imm_max: 2047, signed: true}
  - mnemonic: mpyi
    encoder: mpyi
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: reg, class: gpr, width: 32}
      - {kind: imm, width: 12, imm_min: -2048, imm_max: 2047, signed: true}
  - mnemonic: memw.ld
    encoder: memwld
    flags: [reads_mem]
    operands:
      - {kind: reg, class: gpr, width: 32, access: write}
      - {kind: mem, width: 32}
  - mnemonic: memw.st
    encoder: memwst
    flags: [writes_mem]
    operands:
      - {kind: reg, class: gpr, width: 32}
      - {kind: mem, width: 32}
  - mnemonic: jump
    encoder: jump
    flags: [branch, terminator, reloc]
    operands:
      - {kind: sym, width: 32}
  - mnemonic: jumpr
    encoder: jumpr
    flags: [branch, terminator]
    operands:
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: call
    encoder: call
    flags: [branch, reloc]
    operands:
      - {kind: sym, width: 32}
  - mnemonic: deallocreturn
    encoder: dealloc
    flags: [return, terminator]
    operands:
      - {kind: reg, class: gpr, width: 32}
  - mnemonic: trap
    encoder: trap
    flags: [may_trap]
    operands:
      - {kind: imm, width: 8, imm_min: 0, imm_max: 255, signed: false}
  - mnemonic: vadd
    encoder: vadd
    required: [hvx]
    operands:
      - {kind: reg, class: vec, width: 128, access: write}
      - {kind: reg, class: vec, width: 128}
      - {kind: reg, class: vec, width: 128}
  - mnemonic: vmul
    encoder: vmul
    required: [hvx]
    operands:
      - {kind: reg, class: vec, width: 128, access: write}
      - {kind: reg, class: vec, width: 128}
      - {kind: reg, class: vec, width: 128}
  - mnemonic: vld
    encoder: vld
    flags: [reads_mem]
    required: [hvx]
    operands:
      - {kind: reg, class: vec, width: 128, access: write}
      - {kind: mem, width: 128}
  - mnemonic: vst
    encoder: vst
    flags: [writes_mem]
    required: [hvx]
    operands:
      - {kind: reg, class: vec, width: 128}
      - {kind: mem, width: 128}
syntaxes:
  - {name: default, comment: "//", separator: ", "}
  - {name: packet, comment: "//", separator: " ; "}
sections:
  - {name: ".text", flags: [exec, alloc, code], align: 4, content: code}
  - {name: ".rodata", flags: [alloc, readonly, data], align: 4, content: data}
  - {name: ".data", flags: [write, alloc, data], align: 4, content: data}
  - {name: ".bss", flags: [write, alloc, zerofill, data], align: 4, content: data}
  - {name: ".tdata", flags: [write, alloc, tls, data], align: 4, content: data}
  - {name: ".got", flags: [write, alloc, data], align: 4, content: data}
linkages:
  - {name: func_global, binding: global, visibility: default, symtype: func}
  - {name: func_weak, binding: weak, visibility: default, symtype: func}
  - {name: object_global, binding: global, visibility: default, symtype: object}
  - {name: local_sym, binding: local, visibility: default, symtype: none}
relocs:
  - {name: R_HEX_NONE, width: 32, expr: "S + A"}
  - {name: R_HEX_32, width: 32, expr: "S + A"}
  - {name: R_HEX_16, width: 16, expr: "S + A"}
  - {name: R_HEX_B22_PCREL, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_HEX_B15_PCREL, width: 32, signed: true, pcrel: true, expr: "S + A - P"}
  - {name: R_HEX_LO16, width: 16, expr: "S + A"}
  - {name: R_HEX_HI16, width: 16, expr: "S + A"}
  - {name: R_HEX_GOTREL_LO16, width: 16, expr: "GOT(S) + A"}
  - {name: R_HEX_GOTREL_HI16, width: 16, expr: "GOT(S) + A"}
  - {name: R_HEX_TLS_GD, width: 32, expr: "TLS(S) + A"}
  - {name: R_HEX_TLS_TPREL, width: 32, expr: "TLS(S) + A"}
  - {name: R_HEX_GLOB_DAT, width: 32, expr: S}
  - {name: R_HEX_JMP_SLOT, width: 32, expr: S}
  - {name: R_HEX_RELATIVE, width: 32, expr: "B + A"}
debug:
  - {kind: target, ref: "", msg: "hexagon VLIW packets: scalar base + hvx + duplex"}
  - {kind: form, ref: vadd, msg: "hvx forms require hvx"}
  - {kind: syntax, ref: packet, msg: "packet syntax separates slots with ;"}
backend:
  file: backend/hexagon.json
