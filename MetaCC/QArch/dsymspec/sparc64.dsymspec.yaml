  - {name: R_SPARC_RELATIVE, width: 64, expr: "B + A"}
  - {name: R_SPARC_GLOB_DAT, width: 64, expr: "S + A"}
  - {name: R_SPARC_JMP_SLOT, width: 64, expr: "S + A"}
