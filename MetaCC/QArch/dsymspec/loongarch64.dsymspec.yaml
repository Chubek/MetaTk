# pseudo-code; the grammar is documented in README.md.
#
# loongarch64.dsymspec — LoongArch64 (LA64), LP64D psABI, little-endian.
# Data: TableGen LoongArch target (R0-R31 + ABI aliases, F0-F31, VR/XR
# vectors, FCC0-7, CSR), arch_oracle loongarch64 summary, toolchain_orace
# (R_LARCH_* ELF relocations: SOP_PUSH/POP/PC/HI/LO/GOT/TLS), ccbe_oracle
# ABI topics (LP64D calling convention, GOT/PLT/TLS).
# Strata: base | f32/f64 | lsx | lasx | lbt | atomics | priv.

schema: 1
targets:
  - {arch: loongarch64, subarch: la64, addr_size: 64, op_size: 32, addr_def: 64, align: 4, byte_order: little, obj_format: ELF64, abi: LP64D, calling_conv: lp64d, features: [base, f32, f64]}
features:
