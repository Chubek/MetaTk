encoders:
  # Fixed 32-bit little-endian skeletons (opcode + rd/rj/rk + immediates).
  - name: nop
    max_bytes: 4
    body: |
      EMIT32LE 0x03400000
  - name: add
    max_bytes: 4
    body: |
      EMIT32LE 0x00100000 + rd*32 + rj*1024 + rk*32768
  - name: sub
    max_bytes: 4
    body: |
      EMIT32LE 0x00110000 + rd*32 + rj*1024 + rk*32768
  - name: and
    max_bytes: 4
    body: |
      EMIT32LE 0x00148000 + rd*32 + rj*1024 + rk*32768
  - name: or
    max_bytes: 4
    body: |
      EMIT32LE 0x00140000 + rd*32 + rj*1024 + rk*32768
  - name: xor
    max_bytes: 4
    body: |
      EMIT32LE 0x0014C000 + rd*32 + rj*1024 + rk*32768
  - name: nor
    max_bytes: 4
    body: |
      EMIT32LE 0x00150000 + rd*32 + rj*1024 + rk*32768
  - name: slt
    max_bytes: 4
    body: |
      EMIT32LE 0x00120000 + rd*32 + rj*1024 + rk*32768
  - name: addi
    max_bytes: 4
    body: |
      EMIT32LE 0x02800000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: lu12iw
    max_bytes: 4
    body: |
      EMIT32LE 0x14000000 + rd*32 + ((imm + 524288) % 1048576)
  - name: slli
    max_bytes: 4
    body: |
      EMIT32LE 0x00408000 + rd*32 + rj*1024 + ((imm + 64) % 64)*65536
  - name: srli
    max_bytes: 4
    body: |
      EMIT32LE 0x00448000 + rd*32 + rj*1024 + ((imm + 64) % 64)*65536
  - name: srai
    max_bytes: 4
    body: |
      EMIT32LE 0x00448000 + rd*32 + rj*1024 + ((imm + 64) % 64)*65536 + 65536*64
  - name: mul
    max_bytes: 4
    body: |
      EMIT32LE 0x001C0000 + rd*32 + rj*1024 + rk*32768
  - name: div
    max_bytes: 4
    body: |
      EMIT32LE 0x00200000 + rd*32 + rj*1024 + rk*32768
  - name: ldw
    max_bytes: 4
    body: |
      EMIT32LE 0x28800000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: stw
    max_bytes: 4
    body: |
      EMIT32LE 0x29800000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: ldd
    max_bytes: 4
    body: |
      EMIT32LE 0x28C00000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: std
    max_bytes: 4
    body: |
      EMIT32LE 0x29C00000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: ldb
    max_bytes: 4
    body: |
      EMIT32LE 0x28000000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: stb
    max_bytes: 4
    body: |
      EMIT32LE 0x29000000 + rd*32 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: preld
    max_bytes: 4
    body: |
      EMIT32LE 0x2A800000 + rj*1024 + ((imm + 4096) % 4096)*65536
  - name: b
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x50000000
      EMIT_RELOCATION sym, R_LARCH_B26
  - name: bl
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x54000000
      EMIT_RELOCATION sym, R_LARCH_B26
  - name: beq
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x58000000 + rj*1024 + rd*32
      EMIT_RELOCATION sym, R_LARCH_B16
  - name: bne
    max_bytes: 4
    max_relocs: 1
    body: |
      EMIT32LE 0x5C000000 + rj*1024 + rd*32
      EMIT_RELOCATION sym, R_LARCH_B16
  - name: jirl
    max_bytes: 4
    body: |
      EMIT32LE 0x4C000000 + rd*32 + rj*1024 + ((imm + 65536) % 65536)*65536
